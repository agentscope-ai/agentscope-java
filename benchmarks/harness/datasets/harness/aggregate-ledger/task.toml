version = "1.0"
# Replacing the whole workspace in the separate verifier preserves deletions too.
artifacts = ["/workspace"]

[metadata]
author_name = "AgentScope evaluation"
tags = ["smoke", "data-processing", "file-tools"]

[verifier]
timeout_sec = 60
environment_mode = "separate"

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/workspace"
