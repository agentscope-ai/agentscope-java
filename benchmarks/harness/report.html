<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HarnessAgent · 评测报告</title>
<style>
:root{--ink:#172e43;--muted:#61758a;--line:#dce5eb;--green:#17795f;--blue:#2558a5;--paper:#fff;--bg:#f1f5f8;--red:#b94b44;--amber:#936b16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #79aae7;outline-offset:2px}.wrap{max-width:1600px;margin:auto;padding:28px 38px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{font-size:17px;font-weight:750;letter-spacing:.3px}.brand span{display:inline-grid;place-items:center;background:var(--ink);color:#fff;width:31px;height:31px;border-radius:8px;margin-right:10px}.eyebrow{font-size:11px;letter-spacing:1.8px;font-weight:700;color:var(--muted)}h1{font-size:32px;letter-spacing:-.8px;margin:6px 0}h2{font-size:18px;margin:0}h3{font-size:14px;margin:20px 0 8px}.muted{color:var(--muted)}.tiny{font-size:12px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:0 0 24px}.hero p{margin:4px 0}.badge{display:inline-block;border-radius:5px;padding:3px 8px;background:#e4edf5;color:#47617a;font-size:12px;font-weight:650}.passed{color:var(--green);background:#e4f3ec}.not_passed{color:var(--red);background:#fbeae8}.unscored{color:var(--amber);background:#fcf0d8}.missing{color:#637487;background:#e9edf0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:7px 13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card{border:1px solid var(--line);background:white;border-radius:12px;padding:18px 22px}.metric{font-size:31px;line-height:1.4;letter-spacing:-.8px;font-weight:720;margin:6px 0}.metric small{font-size:15px;color:var(--muted);font-weight:400;letter-spacing:0}.datasets{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:18px}.dataset{display:grid;grid-template-columns:1fr auto;gap:6px 20px}.bar{height:7px;background:#e8edf2;border-radius:7px;display:flex;overflow:hidden;margin:7px 0}.bar span{display:block;height:100%}.note{padding:12px 16px;border-left:3px solid #8ca9c2;background:#e9f0f5;border-radius:4px;margin:16px 0 22px;color:#526a80;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panelhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.filters{display:flex;gap:8px;padding:14px 18px;flex-wrap:wrap}.filters input{flex:1;min-width:160px}.filters input,.filters select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:12px}th{background:#f8fafc;color:var(--muted);font-weight:500;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:14px 16px;border-bottom:1px solid #edf1f5;vertical-align:top}.taskbtn{display:block;text-align:left;border:0;padding:0;background:transparent;color:var(--ink);font-size:13px;font-weight:650;white-space:nowrap}.preview{font-size:12px;line-height:1.5;color:var(--muted);max-width:290px;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}tr.selected{background:#edf5fc}tr:hover{background:#f3f8fc}.footer{padding:13px 18px;color:var(--muted);font-size:12px}.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 18px;gap:18px}.tabs button{border:0;border-bottom:2px solid transparent;background:none;padding:13px 0;color:var(--muted);font-size:13px}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:650}.detailbody{padding:18px 20px;max-height:700px;overflow:auto}.prose{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;margin:0}.submetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.submetric{background:#f4f7fa;padding:12px;border-radius:7px}.submetric strong{display:block;font-size:19px}.pill{display:inline-block;background:#f1f5f8;border:1px solid #e1e9ef;border-radius:4px;margin:3px 4px 3px 0;padding:2px 6px;font-size:11px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fa;border:1px solid #e3eaf0;border-radius:6px;padding:12px;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;margin:8px 0;max-height:360px;overflow:auto}details{margin:8px 0}summary{cursor:pointer;font-size:12px;color:var(--muted)}.event{border-left:2px solid #dce6ef;padding:0 0 16px 15px;margin-left:5px}.event .eventname{font-size:11px;letter-spacing:.4px;font-weight:700;color:var(--muted);margin-bottom:5px}.event.user_message{border-color:#9dbdde}.event.agent_response{border-color:#80bca7}.event .prose{font-size:13px}.checks{list-style:none;padding:0;margin:0}.checks li{padding:10px 0;border-bottom:1px solid #edf1f5;overflow-wrap:anywhere;font-size:12px}.checkmark{font-weight:bold;margin-right:8px;color:var(--green)}.source{word-break:break-all;font:11px/1.7 ui-monospace,SFMono-Regular,monospace;color:var(--muted)}.meta{margin-top:24px}a{color:var(--blue)}.empty{padding:30px;text-align:center;color:var(--muted)}[hidden]{display:none!important}@media(max-width:1050px){.wrap{padding:22px}.workspace{grid-template-columns:1fr}.detailbody{max-height:none}.cards{gap:8px}.card{padding:15px}}@media(max-width:600px){.wrap{padding:16px}.cards,.datasets{grid-template-columns:repeat(2,1fr)}.datasets .dataset{grid-column:1/-1}.hero{display:block}h1{font-size:27px}.hero>div:last-child{margin-top:12px}header{margin-bottom:20px}.metric{font-size:27px}.submetrics{grid-template-columns:1fr 1fr}.panelhead{flex-wrap:wrap}}@media print{.wrap{padding:0}.filters,.btn,.tabs{display:none}.workspace{display:block}.panel{margin:16px 0;break-inside:avoid}.detailbody{max-height:none}body{background:#fff}pre{max-height:none}.cards{gap:8px}}
</style>
</head>
<body><div class="wrap">
<header><div class="brand"><span>A</span>AgentScope <span style="display:inline;background:none;color:var(--muted);font-size:13px;font-weight:400">/ Evaluation</span></div><button class="btn" id="print">打印 / PDF</button></header>
<section class="hero"><div><div class="eyebrow">HARNESSAGENT · INTERNAL EVALUATION</div><h1>每一道任务，都有据可查。</h1><p id="subtitle" class="muted"></p><p id="batch" class="source"></p></div><div><span id="completion" class="badge"></span><p id="finished" class="muted tiny"></p></div></section>
<div class="cards" id="cards"></div><div class="datasets" id="datasets"></div>
<div class="note">评测范围：本批为开发抽样任务，不代表完整官方数据集成绩或排行榜。通过率按本批计划题数计算；未评分与缺失结果单独保留。模型名称为提供方别名，未锁定底层快照。</div>
<div class="note" id="audit-note" hidden></div>
<main class="workspace"><section class="panel"><div class="panelhead"><h2>逐题结果</h2><span class="muted tiny" id="count"></span></div>
<div class="filters"><input id="search" type="search" aria-label="搜索题号或任务内容" placeholder="搜索题号、任务内容…"><select id="dataset" aria-label="数据集"><option value="">全部数据集</option></select><select id="status" aria-label="结果状态"><option value="">全部状态</option><option value="passed">通过</option><option value="not_passed">未通过</option><option value="unscored">未评分</option><option value="missing">缺失</option></select></div>
<div class="tablewrap"><table><thead><tr><th>任务 / 题目原文</th><th>官方结果</th><th>耗时</th><th>工具</th></tr></thead><tbody id="rows"></tbody></table></div><div class="footer">点击题号查看详情。r0 表示首次运行，非重试次数。</div></section>
<section class="panel" id="detail"><div class="panelhead"><h2 id="detailtitle"></h2><span id="detailbadge" class="badge"></span></div><div class="tabs" role="tablist" aria-label="题目详情"><button class="active" id="tab-task" role="tab" aria-controls="pane-task" aria-selected="true" data-tab="task">题目与用量</button><button id="tab-trace" role="tab" aria-controls="pane-trace" aria-selected="false" data-tab="trace">执行过程</button><button id="tab-score" role="tab" aria-controls="pane-score" aria-selected="false" data-tab="score">评分依据</button></div><div class="detailbody"><div id="pane-task" role="tabpanel" aria-labelledby="tab-task"></div><div id="pane-trace" role="tabpanel" aria-labelledby="tab-trace" hidden></div><div id="pane-score" role="tabpanel" aria-labelledby="tab-score" hidden></div></div></section></main>
<section class="panel meta"><div class="panelhead"><h2>任务类型与工具覆盖</h2></div><div class="detailbody" id="coverage"></div></section>
<details class="meta"><summary>版本、数据集与归档信息</summary><pre id="metadata"></pre></details>
<footer class="footer">私有离线报告 · 数据已嵌入此文件，无需服务、API Key 或网络连接。对话来自模拟业务环境；原始 OSS 归档为最终依据。</footer>
</div>
<script>
'use strict';
const DATA = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__REPORT_DATA__'),c=>c.charCodeAt(0))));
const $=id=>document.getElementById(id), fmt=n=>n==null?'—':Number(n).toLocaleString('zh-CN'), pct=(n,d)=>d?Math.round(n/d*100)+'%':'—';
const labels={passed:'通过',not_passed:'未通过',unscored:'未评分',missing:'缺失'}, names={tau:'τ-bench',appworld:'AppWorld'};
const pretty=x=>typeof x==='string'?x:JSON.stringify(x,null,2);
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function duration(s){if(s==null)return '—';return s<60?Math.round(s)+' 秒':Math.floor(s/60)+'分 '+Math.round(s%60)+'秒'}
function counts(cases){return {total:cases.length,passed:cases.filter(c=>c.outcome==='passed').length,scored:cases.filter(c=>c.score!=null).length,missing:cases.filter(c=>c.outcome==='missing').length,unscored:cases.filter(c=>c.outcome==='unscored').length,failed:cases.filter(c=>c.outcome==='not_passed').length}}
const cases=DATA.cases, total=counts(cases), sum=key=>cases.reduce((n,c)=>n+(c[key]||0),0);
$('subtitle').textContent=DATA.manifest.tag+'  ·  '+DATA.manifest.model+'  ·  '+total.total+' 题 · '+(DATA.manifest.selection?.name||'冒烟测试');
$('batch').textContent=DATA.manifest.batch_id;
if(DATA.audit){$('audit-note').hidden=false;$('audit-note').textContent=DATA.audit.notice}
$('completion').textContent=DATA.completed?'评测已结束':'归档快照 · 尚未结束';
$('completion').classList.toggle('passed',!!DATA.completed?.results_complete);
$('finished').textContent=DATA.completed?.time?'完成于 '+new Date(DATA.completed.time*1000).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' (UTC+8)':'';
const metrics=[['任务通过',total.passed+' / '+total.total,'本批端到端通过率 '+pct(total.passed,total.total)],['评分覆盖率',pct(total.scored,total.total),total.scored+' 题已评分 · '+total.unscored+' 未评分 · '+total.missing+' 缺失'],['执行耗时合计',duration(sum('duration_seconds')),'逐题耗时之和；不含构建与排队'],['工具调用',fmt(sum('tool_calls')),fmt(sum('model_calls'))+' 次 Agent 模型调用']];
for(const [label,value,hint] of metrics){const card=el('div','card');card.append(el('div','muted tiny',label),el('div','metric',value),el('div','muted tiny',hint));$('cards').append(card)}
for(const dataset of [...new Set(cases.map(c=>c.dataset))]){const c=counts(cases.filter(c=>c.dataset===dataset));const d=el('div','card dataset');d.append(el('strong','',names[dataset]||dataset),el('strong','',c.passed+' / '+c.total+' 通过'));const bar=el('div','bar');for(const [num,color] of [[c.passed,'var(--green)'],[c.failed,'var(--red)'],[c.unscored,'#dca54a'],[c.missing,'#bbc7d1']]){const s=el('span');s.style.width=(c.total?num/c.total*100:0)+'%';s.style.background=color;bar.append(s)}d.append(bar,el('span','muted tiny',pct(c.passed,c.total)),el('div','muted tiny','评分 '+c.scored+'/'+c.total+' · 未通过 '+c.failed+' · 未评分 '+c.unscored+' · 缺失 '+c.missing));$('datasets').append(d);const option=el('option','',names[dataset]||dataset);option.value=dataset;$('dataset').append(option)}
$('metadata').textContent=JSON.stringify({manifest:DATA.manifest,archived_summary:DATA.summary,completion:DATA.completed},null,2);
if(DATA.coverage){const target=$('coverage');for(const [group,c] of Object.entries(DATA.coverage.categories)){target.append(el('div','',group+'：'+c.passed+'/'+c.planned+' 通过 · '+c.not_passed+' 未通过 · '+c.unscored+' 未评分 · '+c.missing+' 缺失'))}target.append(el('h3','','τ-bench 实际调用工具（涉及题数）'));for(const [name,n] of Object.entries(DATA.coverage.tau_tools_case_counts))target.append(el('span','pill',name+' · '+n));target.append(el('h3','','AppWorld 请求代码中的 API（涉及题数）'),el('p','muted tiny','静态识别直接 apis.app.method 调用；分支、循环和别名会影响实际执行，以下不是运行时 API 调用次数。'));for(const [name,n] of Object.entries(DATA.coverage.appworld_requested_api_case_counts))target.append(el('span','pill',name+' · '+n))}
let selected=cases[0]?.id;
function drawRows(){const query=$('search').value.toLowerCase();const filtered=cases.filter(c=>(!$('dataset').value||c.dataset===$('dataset').value)&&(!$('status').value||c.outcome===$('status').value)&&[c.id,c.instruction].join(' ').toLowerCase().includes(query));$('rows').replaceChildren();$('count').textContent=filtered.length+' / '+cases.length+' 题';for(const c of filtered){const tr=el('tr',c.id===selected?'selected':'');const td=el('td');const button=el('button','taskbtn',(names[c.dataset]||c.dataset)+' / '+c.task_id+' · r'+c.repeat);button.addEventListener('click',()=>{selected=c.id;drawRows();drawDetail(c)});td.append(button,el('div','preview',c.instruction||'任务原文尚未归档'));const status=el('td');status.append(el('span','badge '+c.outcome,labels[c.outcome]));tr.append(td,status,el('td','',duration(c.duration_seconds)),el('td','',fmt(c.tool_calls)));$('rows').append(tr)}if(!filtered.length){const tr=el('tr'),td=el('td','empty','没有符合条件的题目');td.colSpan=4;tr.append(td);$('rows').append(tr)}}
function block(parent,label,value){parent.append(el('h3','',label),el('p','prose',value))}
function raw(parent,label,value){const details=el('details');details.append(el('summary','',label),el('pre','',pretty(value)));parent.append(details)}
function drawDetail(c){$('detailtitle').textContent=(names[c.dataset]||c.dataset)+' / '+c.task_id;$('detailbadge').className='badge '+c.outcome;$('detailbadge').textContent=labels[c.outcome];const task=$('pane-task');task.replaceChildren();block(task,'任务原文',c.instruction||'未找到任务描述。');task.append(el('p','muted tiny',c.dataset==='tau'?'这是用户模拟器的完整目标，Agent 在多轮对话中逐步获得信息。':'AppWorld 原始任务指令。'));const ms=el('div','submetrics');for(const [label,value] of [['耗时',duration(c.duration_seconds)],['模型调用',fmt(c.model_calls)],['工具调用',fmt(c.tool_calls)]]){const m=el('div','submetric');m.append(el('span','muted tiny',label),el('strong','',value));ms.append(m)}task.append(ms);block(task,'Agent Token 用量',c.token_usage?fmt(c.token_usage.known_input_tokens)+' 输入 / '+fmt(c.token_usage.known_output_tokens)+' 输出':'暂无用量记录');task.append(el('p','muted tiny',c.token_usage?'用量覆盖 '+c.token_usage.covered_calls+'/'+c.token_usage.total_calls+' 次调用；按 API 返回统计，不是费用估算。':''));if(c.simulator_usage.calls){const u=c.simulator_usage;block(task,'用户模拟器 Token 用量',fmt(u.input_tokens)+' 输入 / '+fmt(u.output_tokens)+' 输出');task.append(el('p','muted tiny','覆盖 '+u.covered_calls+'/'+u.calls+' 次归档调用，包含环境初始化；返回模型：'+(u.models.join(', ')||'未记录')))}task.append(el('h3','','实际调用的工具'));for(const name of c.used_tools||[])task.append(el('span','pill',name));task.append(el('p','source','cases/'+c.id+'.json'));if(c.unscored_reason)block(task,'未评分原因',c.unscored_reason);
const trace=$('pane-trace');trace.replaceChildren();trace.append(el('p','muted tiny','按归档序号排列；工具参数与返回可展开。省略重复上下文、业务全量快照和模型推理文本。'));const filter=el('select');filter.setAttribute('aria-label','执行过程类型');for(const [value,text] of [['all','全部事件'],['dialogue','仅对话'],['tools','仅工具']]){const o=el('option','',text);o.value=value;filter.append(o)}trace.append(filter);const events=el('div');trace.append(events);const types={user_message:'用户 / 任务',agent_response:'Agent 回复',tool_request:'工具调用',tool_result:'工具返回'};for(const e of c.timeline){const item=el('div','event '+e.kind);item.dataset.kind=e.kind;item.append(el('div','eventname','#'+e.sequence+' · '+types[e.kind]));if(e.kind.startsWith('tool_'))raw(item,e.kind==='tool_request'?e.value.name:'展开返回结果',e.kind==='tool_request'?e.value.arguments:e.value.result);else item.append(el('p','prose',pretty(e.value)));events.append(item)}filter.addEventListener('change',()=>{for(const item of events.children){const tool=item.dataset.kind.startsWith('tool_');item.hidden=(filter.value==='dialogue'&&tool)||(filter.value==='tools'&&!tool)}});if(!c.timeline.length)events.append(el('p','empty','暂无执行轨迹。'));
const score=$('pane-score');score.replaceChildren();block(score,'官方得分',c.score==null?'未评分':String(c.score));const official=c.official_result;if(official){if(official.error_type){block(score,'评分器异常',official.error_type+(official.error?': '+official.error:''));if(official.traceback)raw(score,'异常堆栈',official.traceback)}else if(c.dataset==='appworld'){block(score,'官方检查项',(official.passes||[]).length+' 通过 / '+(official.failures||[]).length+' 失败 · 共 '+official.num_tests+' 项');const list=el('ul','checks');for(const [rows,mark] of [[official.passes||[],'✓'],[official.failures||[],'✕']])for(const check of rows){const li=el('li');li.append(el('span','checkmark',mark),el('span','',check.requirement));if(check.trace)raw(li,'失败信息',check.trace);list.append(li)}score.append(list)}else{block(score,'τ-bench 官方评分器',JSON.stringify(official.info||{},null,2));score.append(el('p','muted tiny','actions 是评分器的参考动作，实际执行请查看「执行过程」。'))}raw(score,'展开官方评分原始 JSON',official)}else block(score,'评分证据','暂无官方评分结果。');raw(score,'逐题统计 JSON（不含轨迹）',Object.fromEntries(Object.entries(c).filter(([key])=>!['timeline','instruction','simulator_usage','outcome','id'].includes(key))));}
for(const id of ['search','dataset','status'])$(id).addEventListener(id==='search'?'input':'change',drawRows);
for(const button of document.querySelectorAll('[data-tab]'))button.addEventListener('click',()=>{for(const b of document.querySelectorAll('[data-tab]')){const active=b===button;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));$('pane-'+b.dataset.tab).hidden=!active}});
$('print').addEventListener('click',()=>window.print());drawRows();if(cases.length)drawDetail(cases[0]);else $('detail').hidden=true;
</script></body></html>
