server:
  shutdown: graceful
  port: ${BUILDER_PORTAL_PORT:8084}
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: builder-session-portal
  main:
    web-application-type: reactive
  datasource:
    url: ${BUILDER_PORTAL_DB_URL:jdbc:h2:mem:session-portal;DB_CLOSE_DELAY=-1}
    username: ${BUILDER_PORTAL_DB_USER:sa}
    password: ${BUILDER_PORTAL_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${BUILDER_PORTAL_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: ${BUILDER_PORTAL_SCHEMA_INIT:embedded}
      schema-locations: classpath:schema.sql,classpath:managed-runtime-v2.sql,classpath:managed-subagents.sql,classpath:managed-private-objects.sql,classpath:managed-hands.sql,classpath:managed-session-protocol.sql,classpath:managed-turn-ack.sql,classpath:managed-mcp-batch.sql,classpath:managed-tool-publication-lease.sql,classpath:managed-tool-submission.sql
  http:
    codecs:
      max-in-memory-size: ${BUILDER_PORTAL_MAX_REQUEST_SIZE:2MB}
builder:
  managed:
    role: portal
  webhooks:
    allowed-hosts: ${BUILDER_WEBHOOK_ALLOWED_HOSTS:}
    allow-loopback-http: ${BUILDER_WEBHOOK_ALLOW_LOOPBACK_HTTP:false}
  local-dev: ${BUILDER_LOCAL_DEV:false}
  internal-token: ${BUILDER_INTERNAL_TOKEN:}
  control-plane-url: ${BUILDER_CONTROL_URL:http://localhost:8081}
  data-plane-url: ${BUILDER_DATA_URL:http://localhost:8082}
  orchestration-runtime-url: ${BUILDER_ORCHESTRATION_RUNTIME_URL:${BUILDER_CONTROL_URL:http://localhost:8081}}
  portal:
    file-transfer-slots: ${BUILDER_PORTAL_FILE_TRANSFER_SLOTS:16}
    runtime-host-slots: ${BUILDER_PORTAL_RUNTIME_HOST_SLOTS:64}
    runtime-host-control-slots: ${BUILDER_PORTAL_RUNTIME_HOST_CONTROL_SLOTS:16}
    policy-max-ttl-ms: ${BUILDER_PORTAL_POLICY_MAX_TTL_MS:120000}
    policy-refresh-slots: ${BUILDER_PORTAL_POLICY_REFRESH_SLOTS:16}
    policy-refresh-poll-ms: ${BUILDER_PORTAL_POLICY_REFRESH_POLL_MS:1000}
    policy-changes-poll-ms: ${BUILDER_PORTAL_POLICY_CHANGES_POLL_MS:2000}
    max-pending-inputs-per-session: ${BUILDER_PORTAL_MAX_PENDING_INPUTS:128}
    input-delivery-slots: ${BUILDER_PORTAL_INPUT_DELIVERY_SLOTS:32}
    interaction-delivery-poll-ms: ${BUILDER_PORTAL_INTERACTION_DELIVERY_POLL_MS:1000}
    snapshot-ttl-seconds: ${BUILDER_PORTAL_SNAPSHOT_TTL_SECONDS:120}
    max-snapshots-per-session: ${BUILDER_PORTAL_MAX_SNAPSHOTS_PER_SESSION:16}
    snapshot-cleanup-ms: ${BUILDER_PORTAL_SNAPSHOT_CLEANUP_MS:1000}
    max-sse-replay-events: ${BUILDER_PORTAL_MAX_SSE_REPLAY_EVENTS:50000}
    sse-slow-consumer-seconds: ${BUILDER_PORTAL_SSE_SLOW_CONSUMER_SECONDS:30}
    max-sse-connections: ${BUILDER_PORTAL_MAX_SSE_CONNECTIONS:10000}
    sse-recovery-ms: ${BUILDER_PORTAL_SSE_RECOVERY_MS:15000}
    sse-authorization-ms: ${BUILDER_PORTAL_SSE_AUTHORIZATION_MS:15000}
    max-queued-per-application: ${BUILDER_PORTAL_MAX_QUEUED:1000}
    max-queued-per-session: ${BUILDER_PORTAL_MAX_SESSION_QUEUED:128}
    requests-per-second: ${BUILDER_PORTAL_REQUESTS_PER_SECOND:100}
    lifecycle-poll-ms: ${BUILDER_PORTAL_LIFECYCLE_POLL_MS:1000}
    provisioning-poll-ms: ${BUILDER_PORTAL_PROVISIONING_POLL_MS:1000}
    turn-delivery-poll-ms: ${BUILDER_PORTAL_TURN_DELIVERY_POLL_MS:1000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
