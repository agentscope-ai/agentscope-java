[workspace]
members = ["crates/runtime", "crates/adapter-codex", "crates/brain-codex"]
exclude = ["target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
toml = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
managed-brain-runtime = { path = "crates/runtime" }
managed-adapter-codex = { path = "crates/adapter-codex" }

# Sources are fetched and SHA-256 verified by scripts/prepare-codex.sh.
# Keep the upstream workspace intact: these are library dependencies, never a CLI subprocess.
codex-core = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/core" }
codex-protocol = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/protocol" }
codex-history = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/history" }
codex-rollout = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/rollout" }
codex-login = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/login" }
codex-home = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/codex-home" }
codex-exec-server = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/exec-server" }
codex-extension-api = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/ext/extension-api" }
codex-features = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/features" }
codex-thread-store = { path = "target/upstream/codex-e742db9f7ba98e63e502b310857d49d047888518/codex-rs/thread-store" }

# Upstream patches must be repeated at the consuming workspace root.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
