server:
  port: ${MANAGED_AGENTS_AGENT_HARNESS_RUNTIME_PORT:8082}
spring:
  application:
    name: managed-agents-agent-harness-runtime
managed-agents:
  session-service:
    url: ${MANAGED_AGENTS_SESSION_SERVICE_URL:http://localhost:8084/internal/session-service/v0}
  internal-token: ${MANAGED_AGENTS_INTERNAL_TOKEN:}
  object-store:
    # Identity only: bytes are accessed through Session Service, never a local provider.
    backend-id: ${MANAGED_AGENTS_OBJECT_STORE_BACKEND_ID:runtime}
  runtime:
    role: agent-harness-runtime
    concurrency: ${MANAGED_AGENTS_RUNTIME_CONCURRENCY:16}
  jwt:
    secret: ${MANAGED_AGENTS_JWT_SECRET:managed-agents-default-dev-secret-change-in-production-32chars}
  vault:
    master-key: ${MANAGED_AGENTS_VAULT_MASTER_KEY:}
  instance-id: ${MANAGED_AGENTS_INSTANCE_ID:}
  # Scratch path for agent assembly; durable files use RemoteWorkspaceStore / Hands.
  workspace-root: ${MANAGED_AGENTS_WORKSPACE_ROOT:${java.io.tmpdir}/managed-brain}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: ${MANAGED_AGENTS_MODEL_NAME:qwen-max}
    stream: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
logging:
  level:
    io.agentcore.managed: INFO
    org.springframework.security: WARN
