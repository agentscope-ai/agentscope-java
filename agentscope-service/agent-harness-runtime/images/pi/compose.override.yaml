# docker compose -f managed-agents/deploy/compose.yaml -f managed-agents/agent-harness-runtime/images/pi/compose.override.yaml ...
services:
  agent-service:
    environment:
      MANAGED_AGENTS_BRAIN_HTTP_ENABLED: "false"
      MANAGED_AGENTS_BRAIN_CALLBACK_URL: ""
      MANAGED_AGENTS_HARNESS_TYPE: ${MANAGED_AGENTS_HARNESS_TYPE:-pi}
      MANAGED_AGENTS_PI_MODEL_OPTIONS: ${MANAGED_AGENTS_PI_MODEL_OPTIONS:-}
      MANAGED_AGENTS_PI_PROVIDER: ${MANAGED_AGENTS_PI_PROVIDER:?Select the PI model provider}
      MANAGED_AGENTS_RUNTIME_SESSION_QUEUE_ENABLED: "true"
  agent-harness-runtime:
    image: ${IMAGE_REPOSITORY}/managed-agents-brain-pi:${SERVICE_VERSION}
    environment: !override
      SESSION_SERVICE_URL: http://agent-service:8084/internal/session-service/v0
      MANAGED_AGENTS_INTERNAL_TOKEN: ${MANAGED_AGENTS_INTERNAL_TOKEN}
      MANAGED_AGENTS_HARNESS_TYPE: ${MANAGED_AGENTS_HARNESS_TYPE:-pi}
      BRAIN_CONCURRENCY: ${BRAIN_CONCURRENCY:-4}
      BRAIN_INLINE_WAIT_MS: ${BRAIN_INLINE_WAIT_MS:-1000}
      BRAIN_DRAIN_MS: ${BRAIN_DRAIN_MS:-30000}
      BRAIN_ABORT_GRACE_MS: ${BRAIN_ABORT_GRACE_MS:-2000}
      PI_MODEL_KEY: ${PI_MODEL_KEY:-}
      # Inject the selected provider credential via the deployment secret mechanism.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    stop_grace_period: 40s
    read_only: true
    tmpfs: ["/tmp:mode=1777", "/workspace:uid=1000,gid=1000"]
    volumes: !override []
    healthcheck: !override
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8082/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
