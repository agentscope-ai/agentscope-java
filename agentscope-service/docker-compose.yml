# Source build of the complete Session Portal architecture.
# Run ./deploy/init-env.sh VERSION LOCAL_IMAGE_NAMESPACE, then:
# docker compose --env-file deploy/.env up --build --wait
name: agentscope-service-dev
services:
  db:
    extends:
      file: ./deploy/compose.yaml
      service: db
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
  schema-control:
    extends:
      file: ./deploy/compose.yaml
      service: schema-control
    build:
      context: ..
      dockerfile: agentscope-service/docker/Dockerfile.control
  schema-portal:
    extends:
      file: ./deploy/compose.yaml
      service: schema-portal
    build:
      context: ..
      dockerfile: agentscope-service/docker/Dockerfile.service
      args:
        MODULE: service-session-portal
  schema-data:
    extends:
      file: ./deploy/compose.yaml
      service: schema-data
    build:
      context: ..
      dockerfile: agentscope-service/docker/Dockerfile.service
      args:
        MODULE: service-dataplane
  schema-managed:
    extends:
      file: ./deploy/compose.yaml
      service: schema-managed
    build:
      context: ..
      dockerfile: agentscope-service/docker/Dockerfile.service
      args:
        MODULE: service-session-portal
  schema-grants:
    extends:
      file: ./deploy/compose.yaml
      service: schema-grants
    volumes:
      - ./deploy/postgres-roles.sh:/postgres-roles.sh:ro
  control:
    extends:
      file: ./deploy/compose.yaml
      service: control
    build:
      context: ..
      dockerfile: agentscope-service/docker/Dockerfile.control
    environment:
      BUILDER_LOCAL_DEV: ${BUILDER_LOCAL_DEV:-true}
  portal:
    extends:
      file: ./deploy/compose.yaml
      service: portal
    build:
      context: ..
      dockerfile: agentscope-service/docker/Dockerfile.service
      args:
        MODULE: service-session-portal
    environment:
      BUILDER_LOCAL_DEV: ${BUILDER_LOCAL_DEV:-true}
  data:
    extends:
      file: ./deploy/compose.yaml
      service: data
    build:
      context: ..
      dockerfile: agentscope-service/docker/Dockerfile.service
      args:
        MODULE: service-dataplane
    environment:
      BUILDER_LOCAL_DEV: ${BUILDER_LOCAL_DEV:-true}
  hands:
    extends:
      file: ./deploy/compose.yaml
      service: hands
    build:
      context: ..
      dockerfile: agentscope-service/docker/Dockerfile.service
      args:
        MODULE: service-hands
  gateway:
    extends:
      file: ./deploy/compose.yaml
      service: gateway
    build:
      context: ..
      dockerfile: agentscope-service/docker/Dockerfile.service
      args:
        MODULE: service-gateway
    environment:
      BUILDER_LOCAL_DEV: ${BUILDER_LOCAL_DEV:-true}
volumes:
  postgres:
  workspaces:
  artifacts:
