# Source build of the complete Agent Service architecture.
# Run ./deploy/init-env.sh VERSION LOCAL_IMAGE_NAMESPACE, then:
# docker compose --env-file deploy/.env up --build --wait
name: managed-agents-dev
services:
  db:
    extends:
      file: ./deploy/compose.yaml
      service: db
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
  schema-query:
    extends:
      file: ./deploy/compose.yaml
      service: schema-query
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.service
      args:
        MODULE: agent-service
  schema-control:
    extends:
      file: ./deploy/compose.yaml
      service: schema-control
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.control
  schema-agent-service:
    extends:
      file: ./deploy/compose.yaml
      service: schema-agent-service
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.service
      args:
        MODULE: agent-service
  schema-data:
    extends:
      file: ./deploy/compose.yaml
      service: schema-data
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.service
      args:
        MODULE: agent-harness-runtime
  schema-runtime:
    extends:
      file: ./deploy/compose.yaml
      service: schema-runtime
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.service
      args:
        MODULE: agent-service
  schema-grants:
    extends:
      file: ./deploy/compose.yaml
      service: schema-grants
    volumes:
      - ./deploy/postgres-roles.sh:/postgres-roles.sh:ro
  control-plane:
    extends:
      file: ./deploy/compose.yaml
      service: control-plane
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.control
    environment:
      MANAGED_AGENTS_LOCAL_DEV: ${MANAGED_AGENTS_LOCAL_DEV:-true}
  agent-service:
    extends:
      file: ./deploy/compose.yaml
      service: agent-service
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.service
      args:
        MODULE: agent-service
    environment:
      MANAGED_AGENTS_LOCAL_DEV: ${MANAGED_AGENTS_LOCAL_DEV:-true}
  agent-harness-runtime:
    extends:
      file: ./deploy/compose.yaml
      service: agent-harness-runtime
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.service
      args:
        MODULE: agent-harness-runtime
    environment:
      MANAGED_AGENTS_LOCAL_DEV: ${MANAGED_AGENTS_LOCAL_DEV:-true}
  tool-worker:
    extends:
      file: ./deploy/compose.yaml
      service: tool-worker
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.service
      args:
        MODULE: tool-worker
  gateway:
    extends:
      file: ./deploy/compose.yaml
      service: gateway
    build:
      context: ..
      dockerfile: managed-agents/docker/Dockerfile.service
      args:
        MODULE: gateway
    environment:
      MANAGED_AGENTS_LOCAL_DEV: ${MANAGED_AGENTS_LOCAL_DEV:-true}
volumes:
  runtime-objects:
  postgres:
  workspaces:
  artifacts:
