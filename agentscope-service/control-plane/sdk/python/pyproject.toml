[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "managed-agents-sdk"
version = "2.1.0b1"
description = "Managed Agents SDK: connect agent frameworks and report to the Control Plane"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "grpcio>=1.80",
    "protobuf>=6.31.1,<7",
]

[project.optional-dependencies]
# OpenClaw Gateway WebSocket RPC 客户端（openclaw 适配器路径 B）。
openclaw = ["websockets>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "grpcio-tools==1.80.0"]

[tool.setuptools.packages.find]
include = ["managed_agents*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
