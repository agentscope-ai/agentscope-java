---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-managed-agentcore-internal-v1alpha1-agent
  failurePolicy: Fail
  name: magent.managed.agentcore.internal
  rules:
  - apiGroups:
    - managed.agentcore.internal
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - agents
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-managed-agentcore-internal-v1alpha1-agent
  failurePolicy: Fail
  name: vagent.managed.agentcore.internal
  rules:
  - apiGroups:
    - managed.agentcore.internal
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - agents
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-managed-agentcore-internal-v1alpha1-mcpserver
  failurePolicy: Fail
  name: vmcpserver.managed.agentcore.internal
  rules:
  - apiGroups:
    - managed.agentcore.internal
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - mcpservers
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-managed-agentcore-internal-v1alpha1-modelconfig
  failurePolicy: Fail
  name: vmodelconfig.managed.agentcore.internal
  rules:
  - apiGroups:
    - managed.agentcore.internal
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - modelconfigs
  sideEffects: None
