{{- if not .Values.schema.only -}}
{{- if not .Values.queryStore.enabled -}}
{{- fail "queryStore.enabled is required for projection schema 3; configure an independent query backend" -}}
{{- end -}}
{{- $cloudDataSecret := include "service.cloudDataSecret" . -}}
{{- $cloudMigrationSecret := include "service.cloudMigrationSecret" . -}}
{{- $name := include "service.name" . -}}
{{- $secret := required "existingSecret is required" .Values.existingSecret -}}
{{- $repository := required "imageRepository is required" .Values.imageRepository -}}
{{- $images := dict "control-plane" "managed-agents-control-plane" "gateway" "managed-agents-gateway" "agent-service" "managed-agents-agent-service" "agent-harness-runtime" "managed-agents-agent-harness-runtime" "tool-worker" "managed-agents-tool-worker" -}}
{{- range $plane, $port := dict "control-plane" 8081 "agent-harness-runtime" 8082 "agent-service" 8084 "gateway" 8080 "tool-worker" 8085 }}
{{- if or (ne $plane "agent-harness-runtime") (eq $.Values.brain.type "agentscope-java") -}}
{{- $config := index $.Values $plane -}}
{{- if and $.Values.schema.enabled (or (eq ($config.existingSecret | default $secret) $.Values.schema.existingSecret) (and $cloudMigrationSecret (eq ($config.existingSecret | default $secret) $cloudMigrationSecret))) -}}
{{- fail "Ordinary service workloads cannot use the migration Secret" -}}
{{- end -}}
{{- if and $cloudDataSecret (or (eq $cloudDataSecret $.Values.schema.existingSecret) (eq $cloudDataSecret $cloudMigrationSecret)) -}}
{{- fail "Cloud business and migration connections require separate Secrets" -}}
{{- end -}}
{{- if lt (int $config.replicas) 1 -}}
{{- fail (printf "%s.replicas must be at least 1" $plane) -}}
{{- end -}}
{{- if and $.Values.userFilesEnabled (or (eq $plane "tool-worker") (eq $plane "control-plane")) (not (has "ReadWriteMany" $.Values.persistence.workspaces.accessModes)) -}}
{{- fail "Component replicas sharing workspaces require ReadWriteMany storage" -}}
{{- end -}}
{{- if and $.Values.userFilesEnabled (eq $plane "control-plane") (not (has "ReadWriteMany" $.Values.persistence.artifacts.accessModes)) -}}
{{- fail "Control requires shared ReadWriteMany artifact storage" -}}
{{- end -}}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $plane }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $plane }}
spec:
  replicas: {{ $config.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $plane }}
  template:
    metadata:
      labels:
        {{- include "service.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $plane }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if has $plane (list "agent-harness-runtime" "agent-service") }}
      initContainers:
        - name: wait-for-control
          image: {{ $config.image | default (printf "%s/%s:%s" $repository (index $images $plane) ($config.imageTag | default $.Values.imageTag | default $.Chart.AppVersion)) | quote }}
          command: [sh, -ec]
          args: ['until curl -fsS http://{{ $name }}-control-plane:8081/healthz >/dev/null; do sleep 3; done']
          {{- with $.Values.evaluation.initResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      {{- end }}
      containers:
        - name: {{ $plane }}
          image: {{ $config.image | default (printf "%s/%s:%s" $repository (index $images $plane) ($config.imageTag | default $.Values.imageTag | default $.Chart.AppVersion)) | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          {{- if eq $plane "control-plane" }}
          args:
            - --storage-driver=postgres
            - --schema-mode=validate
            - --enable-runtime-workers=true
            - --execution-slots={{ $config.executionSlots }}
            - --worker-batch={{ $config.workerBatch }}
            - --storage-max-open-conns={{ $config.databaseMaxOpenConns }}
            - --storage-max-idle-conns={{ $config.databaseMaxIdleConns }}
          {{- else if eq $plane "tool-worker" }}
          args: [--platform-service]
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          {{- if not (has $plane (list "gateway" "agent-harness-runtime")) }}
          envFrom:
            - secretRef: {name: {{ $config.existingSecret | default $secret | quote }}}
            {{- if and (has $plane (list "agent-service" "tool-worker")) $.Values.runtime.mq.existingSecret }}
            - secretRef: {name: {{ $.Values.runtime.mq.existingSecret | quote }}}
            {{- end }}
            {{- if $cloudDataSecret }}
            - secretRef: {name: {{ $cloudDataSecret | quote }}}
            {{- end }}
            {{- if and (has $plane (list "agent-service" "tool-worker")) $.Values.objectStore.existingSecret }}
            - secretRef: {name: {{ $.Values.objectStore.existingSecret | quote }}}
            {{- end }}
            {{- if and (eq $plane "agent-service") $.Values.queryStore.enabled }}
            - secretRef: {name: {{ required "queryStore.existingSecret is required" $.Values.queryStore.existingSecret | quote }}}
            {{- end }}
          {{- end }}
          env:
            - {name: MANAGED_AGENTS_WEBHOOK_ALLOWED_HOSTS, value: {{ join "," $.Values.webhooks.allowedHosts | quote }}}
            - {name: MANAGED_AGENTS_WEBHOOK_SLOTS, value: {{ (index $.Values "control-plane").webhookSlots | quote }}}
            - {name: MANAGED_AGENTS_CHANNEL_SLOTS, value: {{ (index $.Values "control-plane").channelSlots | quote }}}
            - {name: MANAGED_AGENTS_LOCAL_DEV, value: {{ $.Values.localDev | quote }}}
            - {name: MANAGED_AGENTS_USER_FILES_ENABLED, value: {{ $.Values.userFilesEnabled | quote }}}
            {{- if has $plane (list "agent-service" "agent-harness-runtime") }}
            - {name: MANAGED_AGENTS_SESSION_TRACE_ENABLED, value: {{ (index $.Values "agent-service").traceEnabled | quote }}}
            {{- end }}
            - {name: SERVER_PORT, value: {{ $port | quote }}}
            {{- if ne $plane "agent-harness-runtime" }}
            - {name: MANAGED_AGENTS_CONTROL_URL, value: "http://{{ $name }}-control-plane:8081"}
            - {name: MANAGED_AGENTS_AGENT_HARNESS_RUNTIME_URL, value: "http://{{ $name }}-agent-harness-runtime:8082"}
            - {name: MANAGED_AGENTS_TOOL_WORKER_URL, value: "http://{{ $name }}-tool-worker:8085"}
            - {name: MANAGED_AGENTS_AGENT_SERVICE_URL, value: "http://{{ $name }}-agent-service:8084"}
            - {name: AGENT_SERVICE_URL, value: "http://{{ $name }}-agent-service:8084"}
            - {name: MANAGED_AGENTS_AGENT_HARNESS_RUNTIME_PUBLIC_URL, value: "http://{{ $name }}-agent-harness-runtime:8082"}
            - {name: MANAGED_AGENTS_WORKSPACE_ROOT, value: /data/workspaces}
            {{- end }}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS, value: never}
            {{- if eq $plane "agent-harness-runtime" }}
            - {name: MANAGED_AGENTS_SESSION_SERVICE_URL, value: "http://{{ $name }}-agent-service:8084/internal/session-service/v0"}
            - {name: MANAGED_AGENTS_OBJECT_STORE_BACKEND_ID, value: {{ $.Values.objectStore.backendId | quote }}}
            {{- range $key := list "MANAGED_AGENTS_INTERNAL_TOKEN" "MANAGED_AGENTS_JWT_SECRET" "MANAGED_AGENTS_VAULT_MASTER_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: {name: {{ $config.existingSecret | default $secret | quote }}, key: {{ $key }}}
            {{- end }}
            {{- range $key := $config.modelCredentialEnv }}
            - name: {{ $key | quote }}
              valueFrom:
                secretKeyRef: {name: {{ $config.existingSecret | default $secret | quote }}, key: {{ $key | quote }}, optional: true}
            {{- end }}
            {{- end }}
            {{- if has $plane (list "agent-service" "tool-worker") }}
            {{- if eq $plane "agent-harness-runtime" }}
            - {name: MANAGED_AGENTS_SESSION_LOG_ENABLED, value: {{ $.Values.runtime.sessionLog.enabled | quote }}}
            - {name: MANAGED_AGENTS_SESSION_LOG_CHUNKS_ENABLED, value: {{ $.Values.runtime.sessionLog.chunksEnabled | quote }}}
            {{- end }}
            {{- if eq $plane "tool-worker" }}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true"}
            {{- end }}
            - {name: MANAGED_AGENTS_RUNTIME_PROCESS_OWNERSHIP, value: {{ $.Values.runtime.processOwnership | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_FRAGMENT_DEADLINE_SECONDS, value: {{ $.Values.runtime.fragmentDeadlineSeconds | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_TOOL_COLLECTOR_DEADLINE_SECONDS, value: {{ $.Values.runtime.toolCollectorDeadlineSeconds | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_STABLE_ROUTING, value: {{ $.Values.runtime.stableRouting.enabled | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_ROUTE_CELL, value: {{ $.Values.runtime.stableRouting.cell | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_ROUTE_LAYOUT, value: {{ $.Values.runtime.stableRouting.layout | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_ROUTE_SHARDS, value: {{ $.Values.runtime.stableRouting.shards | quote }}}
            {{- if has $plane (list "agent-service" "agent-harness-runtime") }}
            - {name: MANAGED_AGENTS_QUERY_STORE_ENABLED, value: {{ $.Values.queryStore.enabled | quote }}}
            {{- if $.Values.queryStore.enabled }}
            - {name: MANAGED_AGENTS_QUERY_STORE_PROVIDER, value: {{ $.Values.queryStore.provider | quote }}}
            - {name: MANAGED_AGENTS_QUERY_STORE_TABLE_PREFIX, value: {{ $.Values.queryStore.tablePrefix | quote }}}
            - {name: MANAGED_AGENTS_QUERY_STORE_BUILD, value: {{ $.Values.queryStore.build | quote }}}
            - {name: MANAGED_AGENTS_QUERY_STORE_SEGMENT_SPAN, value: {{ $.Values.queryStore.segmentSpan | quote }}}
            - {name: MANAGED_AGENTS_QUERY_STORE_MAX_CONNECTIONS, value: {{ $.Values.queryStore.maxConnections | quote }}}
            {{- end }}
            {{- end }}
            - {name: MANAGED_AGENTS_RUNTIME_SESSION_QUEUE_ENABLED, value: {{ $.Values.runtime.sessionQueue.enabled | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_PROJECTION_TOPIC, value: {{ $.Values.runtime.mq.projectionTopic | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_PROJECTION_GROUP, value: {{ $.Values.runtime.mq.projectionGroup | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_SESSION_READY_TOPIC, value: {{ $.Values.runtime.mq.sessionReadyTopic | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_SESSION_READY_GROUP, value: {{ $.Values.runtime.mq.sessionReadyGroup | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_TURN_TOPIC, value: {{ $.Values.runtime.mq.turnTopic | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_TOOL_EVENT_TOPIC, value: {{ $.Values.runtime.mq.toolEventTopic | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_TOOL_EXECUTE_TOPIC, value: {{ $.Values.runtime.mq.toolExecuteTopic | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_TOOL_CONTROL_TOPIC, value: {{ $.Values.runtime.mq.toolControlTopic | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_TOOL_EXECUTE_GROUP, value: {{ $.Values.runtime.mq.toolExecuteGroup | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_TOOL_CONTROL_GROUP, value: {{ $.Values.runtime.mq.toolControlGroup | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_RESUME_TOPIC, value: {{ $.Values.runtime.mq.resumeTopic | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_HARNESS_RUNTIME_GROUP, value: {{ $.Values.runtime.mq.harnessRuntimeGroup | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_RESUME_GROUP, value: {{ $.Values.runtime.mq.resumeGroup | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_TOOL_EVENTS_GROUP, value: {{ $.Values.runtime.mq.toolEventsGroup | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_CACHE_MESSAGES, value: {{ $.Values.runtime.mq.cacheMessages | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_CACHE_BYTES, value: {{ $.Values.runtime.mq.cacheBytes | int64 | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MQ_SSL, value: {{ $.Values.runtime.mq.ssl | quote }}}
            {{- end }}
            {{- if eq $plane "control-plane" }}
            - {name: CONTROL_PLANE_HTTP_BIND, value: ":8081"}
            - {name: CONTROL_PLANE_ENABLE_KUBERNETES, value: "false"}
            - {name: CONTROL_PLANE_SEED_USERS, value: "false"}
            - {name: CONTROL_PLANE_WORKSPACE_ROOT, value: /data/workspaces}
            - {name: CONTROL_PLANE_ARTIFACT_ROOT, value: /data/artifacts}
            - {name: MANAGED_AGENTS_ALLOW_LOCAL_ENVIRONMENT, value: {{ $.Values.allowLocalEnvironment | quote }}}
            - {name: MANAGED_AGENTS_OAUTH_PUBLIC_URL, value: {{ $.Values.publicURL | quote }}}
            {{- else if eq $plane "tool-worker" }}
            - {name: MANAGED_AGENTS_TOOL_WORKER_PORT, value: "8085"}
            - {name: MANAGED_AGENTS_RUNTIME_TOOL_CONTROL_CONCURRENCY, value: {{ $config.toolControlConcurrency | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_TOOL_INFLIGHT_CAPACITY, value: {{ $config.toolInflightCapacity | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_TOOL_HANDOFF_CAPACITY, value: {{ $config.toolHandoffCapacity | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_TOOL_REPAIR_PERIOD, value: {{ $config.toolRepairPeriod | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_TOOL_CONCURRENCY, value: {{ $config.toolConcurrency | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_TOOL_CALLBACKS, value: {{ $config.toolCallbacks | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_TOOL_RENEWAL_THREADS, value: {{ $config.toolRenewalThreads | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MCP_WORKER_THREADS, value: {{ $config.mcpWorkerThreads | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MCP_CACHED_CLIENTS, value: {{ $config.mcpCachedClients | quote }}}
            - {name: MANAGED_AGENTS_TOOL_WORKER_DB_POOL_SIZE, value: {{ $config.databasePoolSize | quote }}}
            {{- else if ne $plane "gateway" }}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true"}
            {{- if eq $plane "agent-service" }}
            - {name: SPRING_PROFILES_ACTIVE, value: jdbc}
            - {name: MANAGED_AGENTS_JPA_DDL_AUTO, value: validate}
            - {name: MANAGED_AGENTS_SCHEMA_INIT, value: "false"}
            - {name: MANAGED_AGENTS_AGENT_SERVICE_SCHEMA_INIT, value: never}
            - {name: MANAGED_AGENTS_SEED_USERS, value: "false"}
            {{- end }}
            {{- if eq $plane "agent-service" }}
            - {name: MANAGED_AGENTS_HARNESS_TYPE, value: {{ $.Values.brain.type | quote }}}
            {{- if eq $.Values.brain.type "agentscope-java" }}
            - {name: MANAGED_AGENTS_BRAIN_HTTP_ENABLED, value: "true"}
            - {name: MANAGED_AGENTS_BRAIN_CALLBACK_URL, value: "http://{{ $name }}-agent-harness-runtime:8082/api/internal/brain/notify"}
            {{- end }}
            {{- if $.Values.brain.model.bindings }}
            - {name: MANAGED_AGENTS_MODEL_PROVIDER, value: {{ $.Values.brain.model.provider | quote }}}
            - {name: MANAGED_AGENTS_MODEL_OPTIONS, value: "{}"}
            - {name: MANAGED_AGENTS_MODEL_BINDINGS, value: {{ $.Values.brain.model.bindings | toJson | quote }}}
            {{- else if has $.Values.brain.type (list "pi" "pi-durable") }}
            - {name: MANAGED_AGENTS_PI_PROVIDER, value: {{ $.Values.brain.pi.modelProvider | quote }}}
            - {name: MANAGED_AGENTS_PI_MODEL_OPTIONS, value: {{ $.Values.brain.pi.modelOptions | toJson | quote }}}
            {{- else if eq $.Values.brain.type "codex" }}
            - {name: MANAGED_AGENTS_MODEL_PROVIDER, value: {{ $.Values.brain.codex.modelProvider | quote }}}
            - {name: MANAGED_AGENTS_MODEL_OPTIONS, value: {{ $.Values.brain.codex.modelOptions | toJson | quote }}}
            - {name: MANAGED_AGENTS_MODEL_BINDINGS, value: {{ $.Values.brain.codex.modelBindings | toJson | quote }}}
            {{- end }}
            - {name: MANAGED_AGENTS_PROJECTION_ROLE, value: {{ $config.projection.role | quote }}}
            - {name: MANAGED_AGENTS_PROJECTION_CONCURRENCY, value: {{ $config.projection.concurrency | quote }}}
            - {name: MANAGED_AGENTS_PROJECTION_OBJECT_MAX_REQUESTS, value: {{ $config.projection.objectMaxRequests | quote }}}
            - {name: MANAGED_AGENTS_PROJECTION_OBJECT_MAX_INFLIGHT_BYTES, value: {{ $config.projection.objectMaxInflightBytes | int64 | quote }}}
            - {name: MANAGED_AGENTS_AGENT_SERVICE_DB_POOL_SIZE, value: {{ $config.databasePoolSize | quote }}}
            - {name: MANAGED_AGENTS_AGENT_SERVICE_FILE_TRANSFER_SLOTS, value: {{ $config.fileTransferSlots | quote }}}
            {{- else if eq $plane "agent-harness-runtime" }}
            {{- include "service.evaluationEnv" $ | nindent 12 }}
            - {name: MANAGED_AGENTS_RUNTIME_CONCURRENCY, value: {{ $config.concurrency | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_INLINE_TOOL_WAIT_SECONDS, value: {{ $config.inlineToolWaitSeconds | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_MODEL_TIMEOUT_SECONDS, value: {{ $config.modelTimeoutSeconds | quote }}}
            {{- $loadTest := $config.loadTestModel | default dict }}
            - {name: MANAGED_AGENTS_RUNTIME_LOAD_TEST_MODEL_ENABLED, value: {{ $loadTest.enabled | default false | quote }}}
            - {name: MANAGED_AGENTS_RUNTIME_LOAD_TEST_MODEL_PROFILES_JSON, value: {{ $loadTest.profiles | default dict | toJson | quote }}}
            {{- end }}
            {{- end }}
            {{- if has $plane (list "agent-service" "tool-worker") }}
            - {name: MANAGED_AGENTS_OBJECT_STORE_CACHE_BYTES, value: {{ $.Values.objectStore.cacheBytes | int64 | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_CACHE_ITEM_BYTES, value: {{ $.Values.objectStore.cacheItemBytes | int64 | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_STATE_CACHE_ENTRIES, value: {{ $.Values.objectStore.stateCacheEntries | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_MAX_REQUESTS, value: {{ $.Values.objectStore.maxRequests | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_MAX_INFLIGHT_BYTES, value: {{ $.Values.objectStore.maxInflightBytes | int64 | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_CAPACITY_WAIT_MS, value: {{ $.Values.objectStore.capacityWaitMs | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_PROVIDER, value: {{ $.Values.objectStore.provider | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_BACKEND_ID, value: {{ $.Values.objectStore.backendId | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_ENDPOINT, value: {{ $.Values.objectStore.endpoint | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_BUCKET, value: {{ $.Values.objectStore.bucket | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_REGION, value: {{ $.Values.objectStore.region | quote }}}
            - {name: MANAGED_AGENTS_OBJECT_STORE_ROOT, value: /data/runtime-objects}
            {{- end }}
          startupProbe:
            httpGet: {path: {{ if has $plane (list "control-plane") }}/readyz{{ else }}/actuator/health{{ end }}, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: {{ if eq $plane "control-plane" }}/readyz{{ else if has $plane (list "agent-service" "tool-worker") }}/actuator/health/readiness{{ else }}/actuator/health{{ end }}, port: http}
            periodSeconds: 10
          livenessProbe:
            {{- if and $.Values.runtime.processOwnership (has $plane (list "tool-worker" "agent-harness-runtime")) }}
            httpGet: {path: /actuator/health/liveness, port: http}
            {{- else }}
            tcpSocket: {port: http}
            {{- end }}
            periodSeconds: 20
          {{- if has $plane (list "gateway" "agent-service") }}
          # Allow EndpointSlice removal and idle upstream pool eviction before SIGTERM.
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "sleep 10"]
          {{- end }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          {{- if or (has $plane (list "control-plane" "tool-worker")) (and (eq $plane "agent-service") (eq $.Values.objectStore.provider "filesystem")) }}
          volumeMounts:
            {{- if and (has $plane (list "agent-service" "tool-worker")) (eq $.Values.objectStore.provider "filesystem") }}
            - {name: runtime-objects, mountPath: /data/runtime-objects}
            {{- end }}
            {{- if has $plane (list "control-plane" "tool-worker") }}
            - {name: workspaces, mountPath: /data/workspaces}
            {{- end }}
            {{- if has $plane (list "control-plane") }}
            - {name: artifacts, mountPath: /data/artifacts}
            {{- end }}
          {{- end }}
      {{- if or (has $plane (list "control-plane" "tool-worker")) (and (eq $plane "agent-service") (eq $.Values.objectStore.provider "filesystem")) }}
      volumes:
        {{- if and (has $plane (list "agent-service" "tool-worker")) (eq $.Values.objectStore.provider "filesystem") }}
        - name: runtime-objects
          persistentVolumeClaim:
            claimName: {{ required "objectStore.existingClaim requires durable shared RWX storage" $.Values.objectStore.existingClaim }}
        {{- end }}
        {{- if has $plane (list "control-plane" "tool-worker") }}
        - name: workspaces
          {{- if $.Values.userFilesEnabled }}
          persistentVolumeClaim:
            claimName: {{ $.Values.persistence.workspaces.existingClaim | default (printf "%s-workspaces" $name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if has $plane (list "control-plane") }}
        - name: artifacts
          {{- if $.Values.userFilesEnabled }}
          persistentVolumeClaim:
            claimName: {{ $.Values.persistence.artifacts.existingClaim | default (printf "%s-artifacts" $name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $plane }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $plane }}
spec:
  type: {{ if eq $plane "gateway" }}{{ $.Values.service.type }}{{ else }}ClusterIP{{ end }}
  ports:
    - name: http
      port: {{ if eq $plane "gateway" }}{{ $.Values.service.port }}{{ else }}{{ $port }}{{ end }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $plane }}
