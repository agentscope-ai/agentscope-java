{{- if and .Values.queryStore.enabled .Values.queryStore.initialize }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "service.name" . }}-query-schema
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: query-schema
          image: {{ printf "%s/managed-agents-agent-service:%s" .Values.imageRepository ((index .Values "agent-service").imageTag | default .Values.imageTag | default .Chart.AppVersion) | quote }}
          command: [java, -Dloader.main=io.agentcore.managed.server.runtime.managed.ManagedQueryStoreMain, -cp, /app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
          args: [initialize]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          envFrom:
            - secretRef: {name: {{ required "queryStore.existingSecret is required" .Values.queryStore.existingSecret | quote }}}
          env:
            - {name: MANAGED_AGENTS_QUERY_STORE_PROVIDER, value: {{ .Values.queryStore.provider | quote }}}
            - {name: MANAGED_AGENTS_QUERY_STORE_TABLE_PREFIX, value: {{ .Values.queryStore.tablePrefix | quote }}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
{{- end }}
