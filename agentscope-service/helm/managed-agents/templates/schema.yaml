{{- if .Values.schema.enabled -}}
{{- $cloudDataSecret := include "service.cloudDataSecret" . -}}
{{- $cloudMigrationSecret := include "service.cloudMigrationSecret" . -}}

{{- $secret := required "schema.existingSecret is required for independent migration jobs" .Values.schema.existingSecret -}}
{{- if eq $secret .Values.existingSecret -}}
{{- fail "Migration and ordinary service credentials require separate Secrets" -}}
{{- end -}}
{{- if and $cloudMigrationSecret (or (eq $cloudMigrationSecret .Values.existingSecret) (eq $cloudMigrationSecret $cloudDataSecret)) -}}
{{- fail "Cloud business and migration connections require separate Secrets" -}}
{{- end -}}
{{- $name := include "service.name" . -}}
{{- $repository := required "imageRepository is required" .Values.imageRepository -}}
{{- range $component, $image := dict "control-plane" "managed-agents-control-plane" "agent-service" "managed-agents-agent-service" "agent-harness-runtime" "managed-agents-agent-harness-runtime" "runtime" "managed-agents-agent-service" }}
{{- if or (ne $component "agent-harness-runtime") (eq $.Values.brain.type "agentscope-java") }}
{{- $plane := ternary "agent-service" $component (eq $component "runtime") }}
{{- $config := index $.Values $plane }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-schema-{{ $component }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
    app.kubernetes.io/component: schema-{{ $component }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ $.Values.schema.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: schema-{{ $component }}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: schema
          image: {{ printf "%s/%s:%s" $repository $image ($config.imageTag | default $.Values.imageTag | default $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          {{- if eq $component "control-plane" }}
          args: [--storage-driver=postgres, --migrate-only]
          {{- else }}
          command: [java, -Dloader.main=io.agentcore.managed.server.web.persistence.ServiceSchemaMain, -cp, /app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
          args: [--component={{ $component }}]
          {{- end }}
          envFrom:
            - secretRef: {name: {{ $secret | quote }}}
            {{- if $cloudMigrationSecret }}
            - secretRef: {name: {{ $cloudMigrationSecret | quote }}}
            {{- end }}
          resources:
            {{- toYaml $.Values.schema.resources | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
