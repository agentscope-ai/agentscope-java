# Required: the registry namespace from your release manifest.
imageRepository: ""
# Empty uses Chart.appVersion; release packaging sets appVersion.
imageTag: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []
# Pre-create a Secret using deploy/kubernetes.env.example. Never put credentials in values.
existingSecret: ""
# PostgreSQL is operated separately; create cp, rt, dp schemas before installing.
# This Chart runs standalone aistiod: no Kubernetes reconcilers or ASDP gRPC.
allowLocalEnvironment: false
publicURL: http://localhost:18080
service:
  type: ClusterIP
  port: 8080
persistence:
  workspaces:
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteMany]
    size: 10Gi
  artifacts:
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 10Gi
control:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
dataplane:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
scheduler:
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
gateway:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
nodeSelector: {}
tolerations: []
