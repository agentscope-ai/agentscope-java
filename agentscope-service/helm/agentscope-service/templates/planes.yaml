{{- $name := include "service.name" . -}}
{{- $secret := required "existingSecret is required; see deploy/kubernetes.env.example" .Values.existingSecret -}}
{{- $repository := required "imageRepository is required" .Values.imageRepository -}}
{{- range $plane, $port := dict "control" 8081 "dataplane" 8082 "scheduler" 8083 "gateway" 8080 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $plane }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $plane }}
spec:
  # Start with a single replica. DDL and shared-filesystem HA require a separate qualification.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $plane }}
  template:
    metadata:
      labels:
        {{- include "service.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $plane }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (eq $plane "dataplane") (eq $plane "scheduler") }}
      initContainers:
        - name: wait-for-upstream
          image: {{ printf "%s/agentscope-service-%s:%s" $repository $plane ($.Values.imageTag | default $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: [sh, -ec]
          args:
            {{- if eq $plane "dataplane" }}
            - until curl -fsS http://{{ $name }}-control:8081/healthz >/dev/null; do sleep 3; done
            {{- else }}
            - until curl -fsS http://{{ $name }}-dataplane:8082/actuator/health >/dev/null; do sleep 3; done
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      {{- end }}
      containers:
        - name: {{ $plane }}
          image: {{ printf "%s/agentscope-service-%s:%s" $repository $plane ($.Values.imageTag | default $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          {{- if eq $plane "control" }}
          args: [--storage-driver=postgres]
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          {{- if ne $plane "gateway" }}
          envFrom:
            - secretRef: {name: {{ $secret | quote }}}
          {{- end }}
          env:
            - {name: SERVER_PORT, value: {{ $port | quote }}}
            - {name: BUILDER_CONTROL_URL, value: "http://{{ $name }}-control:8081"}
            - {name: BUILDER_DATA_URL, value: "http://{{ $name }}-dataplane:8082"}
            - {name: BUILDER_SCHEDULER_URL, value: "http://{{ $name }}-scheduler:8083"}
            - {name: BUILDER_DATAPLANE_PUBLIC_URL, value: "http://{{ $name }}-dataplane:8082"}
            - {name: BUILDER_WORKSPACE_ROOT, value: /data/workspaces}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS, value: never}
            {{- if eq $plane "control" }}
            - {name: AISTIO_HTTP_BIND, value: ":8081"}
            - {name: AISTIO_ENABLE_KUBERNETES, value: "false"}
            - {name: AISTIO_SEED_USERS, value: "false"}
            - {name: AISTIO_WORKSPACE_ROOT, value: /data/workspaces}
            - {name: AISTIO_ARTIFACT_ROOT, value: /data/artifacts}
            - {name: BUILDER_ALLOW_LOCAL_ENVIRONMENT, value: {{ $.Values.allowLocalEnvironment | quote }}}
            - {name: BUILDER_OAUTH_PUBLIC_URL, value: {{ $.Values.publicURL | quote }}}
            {{- else }}
            - {name: SPRING_PROFILES_ACTIVE, value: jdbc}
            - {name: BUILDER_SEED_USERS, value: "false"}
            {{- end }}
          startupProbe:
            httpGet: {path: {{ if eq $plane "control" }}/healthz{{ else }}/actuator/health{{ end }}, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: {{ if eq $plane "control" }}/healthz{{ else }}/actuator/health{{ end }}, port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          resources:
            {{- toYaml (index $.Values $plane "resources") | nindent 12 }}
          {{- if ne $plane "gateway" }}
          volumeMounts:
            - {name: workspaces, mountPath: /data/workspaces}
            {{- if eq $plane "control" }}
            - {name: artifacts, mountPath: /data/artifacts}
            {{- end }}
          {{- end }}
      {{- if ne $plane "gateway" }}
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: {{ $.Values.persistence.workspaces.existingClaim | default (printf "%s-workspaces" $name) }}
        {{- if eq $plane "control" }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ $.Values.persistence.artifacts.existingClaim | default (printf "%s-artifacts" $name) }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $plane }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  type: {{ if eq $plane "gateway" }}{{ $.Values.service.type }}{{ else }}ClusterIP{{ end }}
  ports:
    - name: http
      port: {{ if eq $plane "gateway" }}{{ $.Values.service.port }}{{ else }}{{ $port }}{{ end }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $plane }}
{{- end }}
