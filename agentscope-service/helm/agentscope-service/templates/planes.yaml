{{- if not .Values.schema.only -}}
{{- $dataSecret := include "service.dataSecret" . -}}
{{- $migrationDataSecret := include "service.migrationDataSecret" . -}}
{{- $mqSecret := .Values.managed.mq.existingSecret | default "" -}}
{{- if and $mqSecret (or (eq $mqSecret .Values.schema.existingSecret) (eq $mqSecret $migrationDataSecret)) -}}
{{- fail "MQ and migration credentials require separate Secrets" -}}
{{- end -}}
{{- $name := include "service.name" . -}}
{{- $secret := required "existingSecret is required" .Values.existingSecret -}}
{{- $repository := required "imageRepository is required" .Values.imageRepository -}}
{{- $images := dict "control" "as-controlplane" "gateway" "as-gateway" "portal" "as-session-portal" "dataplane" "as-dataplane" "hands" "as-hands" -}}
{{- range $plane, $port := dict "control" 8081 "dataplane" 8082 "portal" 8084 "gateway" 8080 "hands" 8085 }}
{{- $config := index $.Values $plane -}}
{{- if and $.Values.schema.enabled (or (eq ($config.existingSecret | default $secret) $.Values.schema.existingSecret) (and $migrationDataSecret (eq ($config.existingSecret | default $secret) $migrationDataSecret))) -}}
{{- fail "Ordinary service workloads cannot use the migration Secret" -}}
{{- end -}}
{{- if and $dataSecret (or (eq $dataSecret $.Values.schema.existingSecret) (eq $dataSecret $migrationDataSecret)) -}}
{{- fail "Business and migration connections require separate Secrets" -}}
{{- end -}}
{{- if lt (int $config.replicas) 1 -}}
{{- fail (printf "%s.replicas must be at least 1" $plane) -}}
{{- end -}}
{{- if and $.Values.userFilesEnabled (or (eq $plane "dataplane") (eq $plane "hands") (eq $plane "control")) (not (has "ReadWriteMany" $.Values.persistence.workspaces.accessModes)) -}}
{{- fail "Component replicas sharing workspaces require ReadWriteMany storage" -}}
{{- end -}}
{{- if and $.Values.userFilesEnabled (eq $plane "control") (not (has "ReadWriteMany" $.Values.persistence.artifacts.accessModes)) -}}
{{- fail "Control requires shared ReadWriteMany artifact storage" -}}
{{- end -}}
{{- if and (eq $plane "dataplane") (ne $config.ddlAuto "validate") -}}
{{- fail "dataplane.ddlAuto must be validate; use the independent schema jobs" -}}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $plane }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $plane }}
spec:
  replicas: {{ $config.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $plane }}
  template:
    metadata:
      labels:
        {{- include "service.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $plane }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ if has $plane (list "hands" "gateway" "portal") }}45{{ else }}30{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if has $plane (list "dataplane" "portal") }}
      initContainers:
        - name: wait-for-control
          image: {{ printf "%s/%s:%s" $repository (index $images $plane) ($config.imageTag | default $.Values.imageTag | default $.Chart.AppVersion) | quote }}
          command: [sh, -ec]
          args: ['until curl -fsS http://{{ $name }}-control:8081/healthz >/dev/null; do sleep 3; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      {{- end }}
      containers:
        - name: {{ $plane }}
          image: {{ printf "%s/%s:%s" $repository (index $images $plane) ($config.imageTag | default $.Values.imageTag | default $.Chart.AppVersion) | quote }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          {{- if eq $plane "control" }}
          args:
            - --storage-driver=postgres
            - --schema-mode=validate
            - --enable-runtime-workers=true
            - --execution-slots={{ $config.executionSlots }}
            - --worker-batch={{ $config.workerBatch }}
            - --storage-max-open-conns={{ $config.databaseMaxOpenConns }}
            - --storage-max-idle-conns={{ $config.databaseMaxIdleConns }}
          {{- else if eq $plane "hands" }}
          args: [--platform-service]
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          {{- if ne $plane "gateway" }}
          envFrom:
            - secretRef: {name: {{ $config.existingSecret | default $secret | quote }}}
            {{- if and (has $plane (list "portal" "dataplane" "hands")) $.Values.managed.mq.existingSecret }}
            - secretRef: {name: {{ $.Values.managed.mq.existingSecret | quote }}}
            {{- end }}
            {{- if $dataSecret }}
            - secretRef: {name: {{ $dataSecret | quote }}}
            {{- end }}
          {{- end }}
          env:
            - {name: BUILDER_WEBHOOK_ALLOWED_HOSTS, value: {{ join "," $.Values.webhooks.allowedHosts | quote }}}
            - {name: BUILDER_WEBHOOK_SLOTS, value: {{ $.Values.control.webhookSlots | quote }}}
            - {name: BUILDER_CHANNEL_SLOTS, value: {{ $.Values.control.channelSlots | quote }}}
            - {name: BUILDER_LOCAL_DEV, value: {{ $.Values.localDev | quote }}}
            - {name: BUILDER_USER_FILES_ENABLED, value: {{ $.Values.userFilesEnabled | quote }}}
            {{- if has $plane (list "portal" "dataplane") }}
            - {name: BUILDER_SESSION_TRACE_ENABLED, value: {{ $.Values.portal.traceEnabled | quote }}}
            {{- end }}
            - {name: SERVER_PORT, value: {{ $port | quote }}}
            - {name: BUILDER_CONTROL_URL, value: "http://{{ $name }}-control:8081"}
            - {name: BUILDER_DATA_URL, value: "http://{{ $name }}-dataplane:8082"}
            - {name: BUILDER_HANDS_URL, value: "http://{{ $name }}-hands:8085"}
            - {name: BUILDER_SESSION_PORTAL_URL, value: "http://{{ $name }}-portal:8084"}
            - {name: SESSION_PORTAL_URL, value: "http://{{ $name }}-portal:8084"}
            - {name: BUILDER_DATAPLANE_PUBLIC_URL, value: "http://{{ $name }}-dataplane:8082"}
            - {name: BUILDER_WORKSPACE_ROOT, value: /data/workspaces}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS, value: never}
            {{- if eq $plane "gateway" }}
            - {name: SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_POOL_MAXIDLETIME, value: {{ $.Values.gateway.httpClientPool.maxIdleTime | quote }}}
            - {name: SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_HTTPCLIENT_POOL_EVICTIONINTERVAL, value: {{ $.Values.gateway.httpClientPool.evictionInterval | quote }}}
            {{- end }}
            {{- if has $plane (list "portal" "dataplane" "hands") }}
            - {name: BUILDER_MANAGED_MQ_TURN_TOPIC, value: {{ $.Values.managed.mq.turnTopic | quote }}}
            - {name: BUILDER_MANAGED_MQ_TOOL_EVENT_TOPIC, value: {{ $.Values.managed.mq.toolEventTopic | quote }}}
            - {name: BUILDER_MANAGED_MQ_TOOL_EXECUTE_TOPIC, value: {{ $.Values.managed.mq.toolExecuteTopic | quote }}}
            - {name: BUILDER_MANAGED_MQ_TOOL_CONTROL_TOPIC, value: {{ $.Values.managed.mq.toolControlTopic | quote }}}
            - {name: BUILDER_MANAGED_MQ_TOOL_EXECUTE_GROUP, value: {{ $.Values.managed.mq.toolExecuteGroup | quote }}}
            - {name: BUILDER_MANAGED_MQ_TOOL_CONTROL_GROUP, value: {{ $.Values.managed.mq.toolControlGroup | quote }}}
            - {name: BUILDER_MANAGED_MQ_RESUME_TOPIC, value: {{ $.Values.managed.mq.resumeTopic | quote }}}
            - {name: BUILDER_MANAGED_MQ_BRAIN_GROUP, value: {{ $.Values.managed.mq.brainGroup | quote }}}
            - {name: BUILDER_MANAGED_MQ_RESUME_GROUP, value: {{ $.Values.managed.mq.resumeGroup | quote }}}
            - {name: BUILDER_MANAGED_MQ_TOOL_EVENTS_GROUP, value: {{ $.Values.managed.mq.toolEventsGroup | quote }}}
            - {name: BUILDER_MANAGED_MQ_CACHE_MESSAGES, value: {{ $.Values.managed.mq.cacheMessages | quote }}}
            - {name: BUILDER_MANAGED_MQ_CACHE_BYTES, value: {{ $.Values.managed.mq.cacheBytes | int64 | quote }}}
            - {name: BUILDER_MANAGED_MQ_SSL, value: {{ $.Values.managed.mq.ssl | quote }}}
            {{- end }}
            {{- if eq $plane "control" }}
            - {name: CONTROL_PLANE_HTTP_BIND, value: ":8081"}
            - {name: CONTROL_PLANE_ENABLE_KUBERNETES, value: "false"}
            - {name: CONTROL_PLANE_SEED_USERS, value: "false"}
            - {name: CONTROL_PLANE_WORKSPACE_ROOT, value: /data/workspaces}
            - {name: CONTROL_PLANE_ARTIFACT_ROOT, value: /data/artifacts}
            - {name: BUILDER_ALLOW_LOCAL_ENVIRONMENT, value: {{ $.Values.allowLocalEnvironment | quote }}}
            - {name: BUILDER_OAUTH_PUBLIC_URL, value: {{ $.Values.publicURL | quote }}}
            {{- else if eq $plane "hands" }}
            - {name: BUILDER_HANDS_PORT, value: "8085"}
            - {name: BUILDER_MANAGED_TOOL_CONTROL_CONCURRENCY, value: {{ $config.toolControlConcurrency | quote }}}
            - {name: BUILDER_MANAGED_TOOL_CONCURRENCY, value: {{ $config.toolConcurrency | quote }}}
            - {name: BUILDER_HANDS_DB_POOL_SIZE, value: {{ $config.databasePoolSize | quote }}}
            {{- else if ne $plane "gateway" }}
            - {name: SPRING_PROFILES_ACTIVE, value: jdbc}
            - {name: BUILDER_JPA_DDL_AUTO, value: validate}
            - {name: BUILDER_SCHEMA_INIT, value: "false"}
            - {name: BUILDER_PORTAL_SCHEMA_INIT, value: never}
            - {name: BUILDER_SEED_USERS, value: "false"}
            {{- if eq $plane "portal" }}
            - {name: BUILDER_PORTAL_DB_POOL_SIZE, value: {{ $config.databasePoolSize | quote }}}
            - {name: BUILDER_PORTAL_FILE_TRANSFER_SLOTS, value: {{ $config.fileTransferSlots | quote }}}
            {{- else if eq $plane "dataplane" }}
            - {name: BUILDER_MANAGED_CONSUMERS_ENABLED, value: "true"}
            - {name: BUILDER_MANAGED_CONCURRENCY, value: {{ $config.concurrency | quote }}}
            - {name: BUILDER_MANAGED_TURN_CALLBACKS, value: {{ $config.turnCallbacks | quote }}}
            - {name: BUILDER_MANAGED_RESUME_CALLBACKS, value: {{ $config.resumeCallbacks | quote }}}
            - {name: BUILDER_MANAGED_TOOL_EVENT_CONCURRENCY, value: {{ $config.toolEventConcurrency | quote }}}
            - {name: BUILDER_MANAGED_CHILD_CONTROL_CONCURRENCY, value: {{ $config.childControlConcurrency | quote }}}
            - {name: BUILDER_RUNTIME_NATIVE_LOG_CONNECTIONS, value: {{ $config.nativeLogConnections | quote }}}
            - {name: BUILDER_RUNTIME_FILE_TRANSFER_SLOTS, value: {{ $config.fileTransferSlots | quote }}}
            - {name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE, value: {{ $config.databasePoolSize | quote }}}
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet: {path: {{ if has $plane (list "control") }}/readyz{{ else }}/actuator/health{{ end }}, port: http}
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: {{ if has $plane (list "control") }}/readyz{{ else }}/actuator/health{{ end }}, port: http}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
          {{- if has $plane (list "gateway" "portal") }}
          lifecycle:
            preStop:
              exec:
                command: [sh, -c, "sleep 10"]
          {{- end }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          {{- if has $plane (list "control" "dataplane" "hands") }}
          volumeMounts:
            {{- if has $plane (list "control" "dataplane" "hands") }}
            - {name: workspaces, mountPath: /data/workspaces}
            {{- end }}
            {{- if has $plane (list "control") }}
            - {name: artifacts, mountPath: /data/artifacts}
            {{- end }}
          {{- end }}
      {{- if has $plane (list "control" "dataplane" "hands") }}
      volumes:
        {{- if has $plane (list "control" "dataplane" "hands") }}
        - name: workspaces
          {{- if $.Values.userFilesEnabled }}
          persistentVolumeClaim:
            claimName: {{ $.Values.persistence.workspaces.existingClaim | default (printf "%s-workspaces" $name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if has $plane (list "control") }}
        - name: artifacts
          {{- if $.Values.userFilesEnabled }}
          persistentVolumeClaim:
            claimName: {{ $.Values.persistence.artifacts.existingClaim | default (printf "%s-artifacts" $name) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $plane }}
  labels:
    {{- include "service.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $plane }}
spec:
  type: {{ if eq $plane "gateway" }}{{ $.Values.service.type }}{{ else }}ClusterIP{{ end }}
  ports:
    - name: http
      port: {{ if eq $plane "gateway" }}{{ $.Values.service.port }}{{ else }}{{ $port }}{{ end }}
      targetPort: http
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $plane }}
{{- end }}
{{- end }}
