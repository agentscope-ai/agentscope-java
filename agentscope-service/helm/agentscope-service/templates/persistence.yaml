{{- range $kind, $config := .Values.persistence }}
{{- if not $config.existingClaim }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "service.name" $ }}-{{ $kind }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "service.labels" $ | nindent 4 }}
spec:
  accessModes: {{ toJson $config.accessModes }}
  {{- if $config.storageClass }}
  storageClassName: {{ $config.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $config.size }}
{{- end }}
{{- end }}
