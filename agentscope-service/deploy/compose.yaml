name: agentscope-service

x-runtime-env: &runtime-env
  SPRING_PROFILES_ACTIVE: jdbc
  BUILDER_SEED_USERS: "false"
  BUILDER_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-agentscope}?currentSchema=dp
  BUILDER_DB_USER: agentscope
  BUILDER_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run init-env.sh first}
  BUILDER_JWT_SECRET: ${BUILDER_JWT_SECRET:?Required}
  BUILDER_INTERNAL_TOKEN: ${BUILDER_INTERNAL_TOKEN:?Required}
  BUILDER_VAULT_MASTER_KEY: ${BUILDER_VAULT_MASTER_KEY:?Required}
  BUILDER_CONTROL_URL: http://control:8081
  BUILDER_DATA_URL: http://data:8082
  BUILDER_SCHEDULER_URL: http://scheduler:8083
  BUILDER_WORKSPACE_ROOT: /data/workspaces
  BUILDER_E2B_API_KEY: ${BUILDER_E2B_API_KEY:-}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never

x-java-health: &java-health
  test: [CMD-SHELL, 'curl -fsS http://localhost:$${SERVER_PORT}/actuator/health >/dev/null']
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 60s

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentscope}
      POSTGRES_USER: agentscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agentscope -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
  control:
    image: ${IMAGE_REPOSITORY:?Set image repository}/as-controlplane:${SERVICE_VERSION:?Set release version}
    restart: unless-stopped
    command: [--storage-driver=postgres]
    environment:
      CONTROL_PLANE_ENABLE_KUBERNETES: 'false'
      CONTROL_PLANE_HTTP_BIND: ':8081'
      CONTROL_PLANE_PRODUCT_DSN: postgres://agentscope:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentscope}?sslmode=disable
      CONTROL_PLANE_STORAGE_DSN: postgres://agentscope:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentscope}?sslmode=disable&search_path=rt
      CONTROL_PLANE_SEED_USERS: 'false'
      CONTROL_PLANE_BOOTSTRAP_ADMIN: ${CONTROL_PLANE_BOOTSTRAP_ADMIN:-admin}
      CONTROL_PLANE_BOOTSTRAP_PASSWORD: ${CONTROL_PLANE_BOOTSTRAP_PASSWORD:?Required}
      CONTROL_PLANE_WORKSPACE_ROOT: /data/workspaces
      CONTROL_PLANE_ARTIFACT_ROOT: /data/artifacts
      BUILDER_JWT_SECRET: ${BUILDER_JWT_SECRET}
      BUILDER_INTERNAL_TOKEN: ${BUILDER_INTERNAL_TOKEN}
      BUILDER_VAULT_MASTER_KEY: ${BUILDER_VAULT_MASTER_KEY}
      BUILDER_DATA_URL: http://data:8082
      BUILDER_OAUTH_PUBLIC_URL: ${BUILDER_OAUTH_PUBLIC_URL:-http://localhost:18080}
      BUILDER_ALLOW_LOCAL_ENVIRONMENT: ${BUILDER_ALLOW_LOCAL_ENVIRONMENT:-false}
    volumes:
      - workspaces:/data/workspaces
      - artifacts:/data/artifacts
    healthcheck:
      test: [CMD, /service-controlplane, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      db: {condition: service_healthy}
  data:
    image: ${IMAGE_REPOSITORY}/as-dataplane:${SERVICE_VERSION}
    restart: unless-stopped
    environment:
      <<: *runtime-env
      SERVER_PORT: 8082
      BUILDER_DATAPLANE_PUBLIC_URL: http://data:8082
    volumes:
      - workspaces:/data/workspaces
    healthcheck: *java-health
    depends_on:
      control: {condition: service_healthy}
  scheduler:
    image: ${IMAGE_REPOSITORY}/as-scheduler:${SERVICE_VERSION}
    restart: unless-stopped
    environment:
      <<: *runtime-env
      SERVER_PORT: 8083
    volumes:
      - workspaces:/data/workspaces
    healthcheck: *java-health
    depends_on:
      data: {condition: service_healthy}
  gateway:
    image: ${IMAGE_REPOSITORY}/as-gateway:${SERVICE_VERSION}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      BUILDER_CONTROL_URL: http://control:8081
      BUILDER_DATA_URL: http://data:8082
      BUILDER_SCHEDULER_URL: http://scheduler:8083
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-18080}:8080'
    healthcheck: *java-health
    depends_on:
      scheduler: {condition: service_healthy}

volumes:
  postgres:
  workspaces:
  artifacts:
