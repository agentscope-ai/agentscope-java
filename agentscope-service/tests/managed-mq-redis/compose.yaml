name: managed-mq-redis
services:
  redis:
    image: redis:7.4.11-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    ports: ['127.0.0.1:16389:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 30
  namesrv:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    command: [sh, mqnamesrv]
    environment:
      JAVA_OPT_EXT: '-Xms128m -Xmx128m -Xmn32m'
    healthcheck:
      test: [CMD-SHELL, "bash -c '</dev/tcp/127.0.0.1/9876'"]
      interval: 5s
      timeout: 3s
      retries: 30
  mq-store-init:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    user: '0:0'
    entrypoint: [sh, -ec]
    command: ['chown 3000:3000 /home/rocketmq/store']
    volumes: [mq-data:/home/rocketmq/store]
  broker:
    image: apache/rocketmq:5.3.2
    platform: linux/amd64
    command: [sh, mqbroker, --enable-proxy, -c, /opt/managed/broker.conf]
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: '-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m'
    ports: ['127.0.0.1:19881:19881']
    volumes:
      - ./broker.conf:/opt/managed/broker.conf:ro
      - ./init-topics.sh:/opt/managed/init-topics.sh:ro
      - ./proxy.json:/home/rocketmq/rocketmq-5.3.2/conf/rmq-proxy.json:ro
      - mq-data:/home/rocketmq/store
    depends_on:
      namesrv: {condition: service_healthy}
      mq-store-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD-SHELL, "bash -c '</dev/tcp/127.0.0.1/19881'"]
      interval: 5s
      timeout: 3s
      retries: 45
      start_period: 20s
  postgres:
    image: postgres:17
    profiles: [database]
    environment:
      POSTGRES_DB: managed_mq_test
      POSTGRES_USER: managed
      POSTGRES_PASSWORD: managed-local-test
    ports: ['127.0.0.1:16991:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U managed -d managed_mq_test]
      interval: 3s
      timeout: 2s
      retries: 30
volumes:
  redis-data:
  mq-data:
  postgres-data:
