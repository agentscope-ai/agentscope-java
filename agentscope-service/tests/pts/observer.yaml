apiVersion: v1
kind: ServiceAccount
metadata: {name: managed-agents-observer, namespace: agencore-ma}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: managed-agents-observer, namespace: agencore-ma}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: managed-agents-observer, namespace: agencore-ma}
subjects:
  - {kind: ServiceAccount, name: managed-agents-observer, namespace: agencore-ma}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: managed-agents-observer}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: managed-agents-observer, namespace: agencore-ma}
spec:
  replicas: 1
  selector:
    matchLabels: {app: managed-agents-observer}
  template:
    metadata:
      labels: {app: managed-agents-observer}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9108"}
    spec:
      serviceAccountName: managed-agents-observer
      imagePullSecrets: [{name: acr-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532}
      containers:
        - name: observer
          image: sca-registry.cn-hangzhou.cr.aliyuncs.com/agentcore/managed-agents-http-mcp-long-tool@sha256:c628644d9b74678ac1f2d7ce23b658291d6e9dbdc380cc6457a0b17381c4557a
          command: [python, /observer/observer.py]
          env:
            - name: DATABASE_URI
              valueFrom: {secretKeyRef: {name: managed-agents-observer, key: uri}}
            - name: INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: managed-agents-credentials, key: MANAGED_AGENTS_INTERNAL_TOKEN}}
          ports: [{name: metrics, containerPort: 9108}]
          volumeMounts: [{name: source, mountPath: /observer, readOnly: true}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /healthz, port: metrics}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 15
      volumes:
        - name: source
          configMap: {name: managed-agents-observer-source}
---
apiVersion: v1
kind: Service
metadata: {name: managed-agents-observer, namespace: agencore-ma}
spec:
  selector: {app: managed-agents-observer}
  ports: [{name: metrics, port: 9108, targetPort: metrics}]
