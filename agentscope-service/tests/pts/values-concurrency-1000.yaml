# Explicit synthetic-model benchmark overlay; real MCP execution, normal MQ and Resume.
agent-harness-runtime:
  databasePoolSize: 256
  concurrency: 512
  turnCallbacks: 512
  resumeCallbacks: 512
  inlineToolWaitSeconds: 1
  modelTimeoutSeconds: 60
  loadTestModel:
    enabled: true
    profiles:
      short-v1:
        firstChunkDelayMs: 300
        chunkIntervalMs: 50
        chunks: 40
        chunkChars: 80
      cancel-v1:
        firstChunkDelayMs: 120000
        chunks: 1
        chunkChars: 80
      tool30-v1:
        firstChunkDelayMs: 300
        chunkIntervalMs: 50
        chunks: 40
        chunkChars: 80
        toolName: longwait__long_wait
        toolArguments: {marker: '{{marker}}', seconds: 30}
        toolRounds: 1
        parallelToolCalls: 1
tool-worker:
  toolConcurrency: 768
agent-service:
  databasePoolSize: 256
