apiVersion: apps/v1
kind: Deployment
metadata: {name: managed-agents-pts-sse-bridge, namespace: agencore-ma}
spec:
  replicas: 1
  selector:
    matchLabels: {app: managed-agents-pts-sse-bridge}
  template:
    metadata:
      labels: {app: managed-agents-pts-sse-bridge}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: acr-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
        - name: bridge
          image: sca-registry.cn-hangzhou.cr.aliyuncs.com/agentcore/managed-agents-http-mcp-long-tool@sha256:c628644d9b74678ac1f2d7ce23b658291d6e9dbdc380cc6457a0b17381c4557a
          command: [python, /source/sse_bridge.py]
          env:
            - {name: BASE_URL, value: "http://managed-agents-pts-gateway"}
            - {name: OUT, value: /results}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: source, mountPath: /source, readOnly: true}
            - {name: results, mountPath: /results}
          readinessProbe:
            httpGet: {path: /status, port: http}
            periodSeconds: 5
      volumes:
        - name: source
          configMap: {name: managed-agents-pts-sse-source}
        - name: results
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: managed-agents-pts-sse-bridge
  namespace: agencore-ma
  annotations:
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-address-type: intranet
    service.beta.kubernetes.io/alibaba-cloud-loadbalancer-vswitch-id: vsw-bp13l755rjruryev21jn2
spec:
  type: LoadBalancer
  selector: {app: managed-agents-pts-sse-bridge}
  ports: [{name: http, port: 80, targetPort: http}]
