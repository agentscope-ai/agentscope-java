# Overlay for 10 Sessions/s with one 30-second waiting tool each.
# 2 x 256 slots leaves headroom above the expected 300 concurrent executions.
tool-worker:
  toolConcurrency: 256
agent-harness-runtime:
  concurrency: 256
  inlineToolWaitSeconds: 1
  modelTimeoutSeconds: 60
