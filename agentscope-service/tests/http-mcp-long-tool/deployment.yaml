apiVersion: apps/v1
kind: Deployment
metadata:
  name: managed-agents-long-tool-mcp
  namespace: agencore-ma
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: managed-agents-long-tool-mcp}
  template:
    metadata:
      labels: {app: managed-agents-long-tool-mcp}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 200
      imagePullSecrets: [{name: acr-pull}]
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: sca-registry.cn-hangzhou.cr.aliyuncs.com/agentcore/managed-agents-long-tool-mcp@sha256:e78fab648ef4d4af820842b41c56b8fd0e30b019a01e8237c6cd21966eda8ab6
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: MCP_TEST_TOKEN
              valueFrom:
                secretKeyRef: {name: managed-agents-long-tool-mcp-auth, key: token}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 5
            periodSeconds: 15
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "4", memory: 8Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: managed-agents-long-tool-mcp
  namespace: agencore-ma
spec:
  type: ClusterIP
  selector: {app: managed-agents-long-tool-mcp}
  ports: [{name: http, port: 8000, targetPort: http}]
