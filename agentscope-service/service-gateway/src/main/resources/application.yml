server:
  shutdown: graceful
  port: ${BUILDER_GATEWAY_PORT:18080}

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: builder-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Long-lived SSE (/api/sessions/*/events/stream) must not be cut by the default timeout.
            connect-timeout: 5000
            response-timeout: 1h
            pool:
              # Retire idle upstream sockets before network idle timeouts can reset them.
              # Active responses, including SSE, are not idle pool connections.
              max-idle-time: 10s
              eviction-interval: 5s
          default-filters:
            # Never forward client-supplied internal auth headers through the public gateway.
            - RemoveRequestHeader=X-Builder-Internal-Token
            - RemoveRequestHeader=X-Builder-Internal-User
          routes:
            # ------------------------------------------------------------------
            # Reject plane-to-plane internal APIs at the public edge.
            # ------------------------------------------------------------------
            - id: reject-internal
              uri: no://op
              order: -1
              predicates:
                - Path=/api/internal/**
              filters:
                - SetStatus=404

            # ------------------------------------------------------------------
            # Data plane — session turns and the worker HTTP API.
            # Evaluated first (order 0): these overlap the control plane's
            # /api/sessions/** and /api/environments/** namespaces.
            # ------------------------------------------------------------------
            - id: agent-session-lifecycle
              uri: ${builder.session-portal-url}
              order: -1
              predicates:
                - Path=/api/v1/agent-sessions,/api/v1/agent-sessions/**,/v1/sessions,/v1/sessions/**
              filters:
                - RemoveRequestHeader=X-Builder-Environment-Key
                - RemoveRequestHeader=X-Builder-Internal-Token
                - RemoveRequestHeader=X-Builder-Internal-User
            - id: portal-runtime-host
              uri: ${builder.session-portal-url}
              order: 0
              predicates:
                - Method=POST
                - Path=/api/v1/runtime-hosts/register,/api/v1/runtime-hosts/*/heartbeat,/api/v1/runtime-hosts/*/state,/api/v1/runtime-hosts/*/credentials,/api/v1/runtime-hosts/*/execution-attempts/**
            - id: portal-collaboration-mcp
              uri: ${builder.session-portal-url}
              order: 0
              predicates:
                - Path=/mcp/collaboration
            - id: portal-task-collaboration
              uri: ${builder.session-portal-url}
              order: 0
              predicates:
                - Header=X-Agent-Task-Token, .+
                - Path=/api/v1/agent-tasks/**,/api/v1/issues/*,/api/v1/issues/*/comments,/api/v1/teams/*
            - id: managed-hands-workers
              uri: ${builder.hands-url}
              order: 0
              predicates:
                - Path=/v1/hands/environments/*/tool-tasks/**
            - id: portal-tool-tasks
              uri: ${builder.session-portal-url}
              order: 0
              predicates:
                - Path=/api/environments/*/tool-tasks/**
            - id: data-session-turn
              uri: ${builder.data-plane-url}
              order: 0
              predicates:
                # user.message + event log + SSE stream + hands-stats
                - Path=/api/sessions/*/events/**,/api/sessions/*/hands-stats
            - id: data-environment-work
              uri: ${builder.data-plane-url}
              order: 0
              predicates:
                # work queue server side (poll/ack/heartbeat/stop/stats)
                - Path=/api/environments/*/work/**
            - id: data-selfhosted-worker
              uri: ${builder.data-plane-url}
              order: 0
              predicates:
                # self-hosted worker callbacks: pending-tools / tool-results / skills
                - Path=/api/environments/*/sessions/*/**
            - id: data-hands-observability
              uri: ${builder.data-plane-url}
              order: 0
              predicates:
                - Path=/api/hands/**

            # ------------------------------------------------------------------
            # Control plane — outbound send + IM platform callbacks/webhooks.
            # Must be higher priority than control-api's /api/channels/** CRUD.
            # ------------------------------------------------------------------
            - id: control-outbound
              uri: ${builder.control-plane-url}
              order: 5
              predicates:
                - Path=/api/outbound/**

            - id: control-channel-callbacks
              uri: ${builder.control-plane-url}
              order: 6
              predicates:
                - Path=/api/channels/dingtalk/**,/api/channels/feishu/**,/api/channels/wecom/**,/api/channels/github/**,/api/channels/gitlab/**

            # ------------------------------------------------------------------
            # Control plane (service-controlplane) — Managed Agents APIs, the /api/v1
            # management API, and the console SPA, all on one upstream port.
            # ------------------------------------------------------------------
            - id: control-api
              uri: ${builder.control-plane-url}
              order: 10
              predicates:
                - Path=/hooks/v1/automations/**,/api/auth/**,/api/user/**,/api/admin/**,/api/agents/**,/api/workspaces/**,/api/marketplaces/**,/api/toolsets/**,/api/environments/**,/api/sessions,/api/sessions/**,/api/memory-stores/**,/api/vaults/**,/api/deployments/**,/api/channels/**,/api/files,/api/files/**,/api/v1/**
              filters:
                # Env-key auth is data-plane only; strip if a client spoofs it toward control.
                - RemoveRequestHeader=X-Builder-Environment-Key
            - id: control-spa
              uri: ${builder.control-plane-url}
              order: 100
              predicates:
                # Console SPA + static assets (and anything else: the control
                # plane 404s what it does not own).
                - Path=/**
              filters:
                - RemoveRequestHeader=X-Builder-Environment-Key

# --------------------------------------------------------------------------
# Cross-plane wiring — same property family as the scheduler plane.
# --------------------------------------------------------------------------
builder:
  hands-url: ${BUILDER_HANDS_URL:http://localhost:8085}
  control-plane-url: ${BUILDER_CONTROL_URL:http://localhost:8081}
  data-plane-url: ${BUILDER_DATA_URL:http://localhost:8082}
  session-portal-url: ${BUILDER_SESSION_PORTAL_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.agentscope: INFO
    org.springframework.cloud.gateway: INFO
