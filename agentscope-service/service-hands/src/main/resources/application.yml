server:
  port: ${BUILDER_HANDS_PORT:8085}
spring:
  application:
    name: builder-managed-hands
  main:
    web-application-type: reactive
  datasource:
    url: ${BUILDER_HANDS_DB_URL:jdbc:postgresql://localhost:5432/builder}
    username: ${BUILDER_HANDS_DB_USER:builder}
    password: ${BUILDER_HANDS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${BUILDER_HANDS_DB_POOL_SIZE:16}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: never
  http:
    codecs:
      max-in-memory-size: 64MB
builder:
  managed:
    role: hands
  control-plane-url: ${BUILDER_CONTROL_URL:http://localhost:8081}
  internal-token: ${BUILDER_INTERNAL_TOKEN:}
  e2b:
    api-key: ${BUILDER_E2B_API_KEY:${E2B_API_KEY:}}
