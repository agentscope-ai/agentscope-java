{{- if and (gt (int .Values.replicaCount) 1) (not .Values.artifact.persistence.enabled) -}}
{{- fail "replicaCount > 1 requires artifact.persistence.enabled=true with shared RWX storage" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aistio
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aistio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aistio
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --http-bind-address=:{{ .Values.service.httpPort }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --health-probe-bind-address=:{{ .Values.healthCheck.port }}
            - --grpc-bind-address=:{{ .Values.service.grpcPort }}
            - --storage-driver={{ .Values.storage.driver }}
            - --storage-max-open-conns={{ .Values.storage.maxOpenConns }}
            - --storage-max-idle-conns={{ .Values.storage.maxIdleConns }}
            - --storage-conn-max-lifetime={{ .Values.storage.connMaxLifetime }}
            - --artifact-root={{ .Values.artifact.root }}
            {{- if .Values.storage.retention.sessionEvents }}
            - --retention-session-events={{ .Values.storage.retention.sessionEvents }}
            {{- end }}
            {{- if .Values.storage.retention.snapshots }}
            - --retention-snapshots={{ .Values.storage.retention.snapshots }}
            {{- end }}
            {{- if .Values.storage.retention.contextSnapshots }}
            - --retention-context-snapshots={{ .Values.storage.retention.contextSnapshots }}
            {{- end }}
            {{- if .Values.storage.retention.metrics }}
            - --retention-metrics={{ .Values.storage.retention.metrics }}
            {{- end }}
            {{- if .Values.leaderElection.enabled }}
            - --leader-elect=true
            {{- end }}
            {{- if .Values.experimental.enabled }}
            - --enable-experimental=true
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - --enable-webhook=true
            {{- end }}
            {{- if .Values.tracing.endpoint }}
            - --otel-endpoint={{ .Values.tracing.endpoint }}
            - --trace-sampling={{ .Values.tracing.sampling }}
            {{- end }}
            {{- if .Values.product.enabled }}
            - --static-dir={{ .Values.product.staticDir }}
            - --workspace-root={{ .Values.product.workspaceRoot }}
            - --allow-local-environment={{ .Values.product.allowLocalEnvironment }}
            {{- end }}
          {{- if or .Values.api.authToken (eq .Values.storage.driver "postgres") .Values.product.enabled }}
          env:
            {{- if .Values.api.authToken }}
            - name: AGENTSCOPE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-token
                  key: token
            {{- end }}
            {{- if eq .Values.storage.driver "postgres" }}
            - name: AISTIO_STORAGE_DSN
              valueFrom:
                secretKeyRef:
                  {{- if .Values.storage.postgres.existingSecret }}
                  name: {{ .Values.storage.postgres.existingSecret }}
                  key: {{ .Values.storage.postgres.existingSecretKey }}
                  {{- else }}
                  name: {{ .Release.Name }}-storage-dsn
                  key: dsn
                  {{- end }}
            {{- end }}
            {{- if .Values.product.enabled }}
            - name: AISTIO_PRODUCT_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "product.existingSecret is required when product.enabled" .Values.product.existingSecret }}
                  key: dsn
            - name: BUILDER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.product.existingSecret }}
                  key: jwtSecret
            - name: BUILDER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.product.existingSecret }}
                  key: internalToken
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.webhook.port }}
              protocol: TCP
            {{- end }}
          {{- if or .Values.webhook.enabled .Values.artifact.persistence.enabled }}
          volumeMounts:
            {{- if .Values.artifact.persistence.enabled }}
            - name: artifacts
              mountPath: {{ .Values.artifact.root }}
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.healthCheck.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.healthCheck.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.webhook.enabled .Values.artifact.persistence.enabled }}
      volumes:
        {{- if .Values.artifact.persistence.enabled }}
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-artifacts" .Release.Name) .Values.artifact.persistence.existingClaim }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ .Values.webhook.certSecret }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
