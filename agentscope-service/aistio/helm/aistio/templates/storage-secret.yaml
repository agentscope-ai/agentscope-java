{{- if and (eq .Values.storage.driver "postgres") .Values.storage.postgres.dsn (not .Values.storage.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-storage-dsn
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aistio
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  dsn: {{ .Values.storage.postgres.dsn | quote }}
{{- end }}
