{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: aistio
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  groups:
    - name: aistio.rules
      rules:
        - alert: AgentNotReady
          expr: agentscope_agent_replicas{kind="ready"} < agentscope_agent_replicas{kind="desired"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Agent {{ "{{" }} $labels.name {{ "}}" }} has unhealthy replicas"
        - alert: DataPlaneDisconnected
          expr: agentscope_dataplane_connected == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Agent {{ "{{" }} $labels.name {{ "}}" }} data plane disconnected"
        - alert: HighReconcileErrors
          expr: rate(agentscope_reconcile_errors_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High reconcile error rate for controller {{ "{{" }} $labels.controller {{ "}}" }}"
        - alert: ProbeLatencyHigh
          expr: histogram_quantile(0.99, rate(agentscope_probe_duration_seconds_bucket[5m])) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "P99 probe latency exceeds 5s for {{ "{{" }} $labels.agent {{ "}}" }}"
        - alert: AgentTaskFailures
          expr: increase(agentscope_agent_task_transitions_total{state="failed"}[10m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "AgentTask failures detected"
            description: "AgentTasks in namespace {{ "{{" }} $labels.namespace {{ "}}" }} are failing on backend {{ "{{" }} $labels.backend {{ "}}" }}."
        - alert: CollaborationRoutesBlocked
          expr: increase(agentscope_comment_routes_total{outcome="blocked"}[10m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Comment routes require human attention"
            description: "A {{ "{{" }} $labels.target_type {{ "}}" }} route was blocked in namespace {{ "{{" }} $labels.namespace {{ "}}" }}."
        - alert: AgentTaskInputStale
          expr: histogram_quantile(0.99, sum by (le,namespace,state) (rate(agentscope_agent_task_input_age_seconds_bucket[10m]))) > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "AgentTask inputs are stale"
            description: "P99 input age exceeds five minutes in namespace {{ "{{" }} $labels.namespace {{ "}}" }}."
        - alert: ExecutionAttemptFailures
          expr: increase(agentscope_execution_attempt_transitions_total{state="failed"}[10m]) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "ExecutionAttempt failures detected"
            description: "Backend {{ "{{" }} $labels.backend {{ "}}" }} failed executions with {{ "{{" }} $labels.failure_code {{ "}}" }}."
{{- end }}
