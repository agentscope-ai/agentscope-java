name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'agentscope-service/frontend/**'
      - 'agentscope-service/aistio/ui/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'agentscope-service/frontend/**'
      - 'agentscope-service/aistio/ui/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  verify:
    name: Verify frontend source and bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentscope-service/frontend

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agentscope-service/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: npm run verify
      - name: Check committed bundle is current
        run: git diff --exit-code -- ../aistio/ui
