name: AgentScope Service source checks
on:
  pull_request:
    paths:
      - 'agentscope-service/**'
      - '.gitignore'
      - '.dockerignore'
      - '.github/workflows/service-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: pip install 'PyYAML>=6,<7'
      - run: python agentscope-service/release/release.py hygiene
      - run: python -m unittest discover -s agentscope-service/release/tests
  controlplane:
    name: Control Plane and SDKs
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CONTROL_PLANE_TEST_POSTGRES_DSN: postgres://postgres:ci-test-only@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agentscope-service/service-controlplane/go.mod
          cache-dependency-path: agentscope-service/service-controlplane/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Verify Go Control Plane and CLI
        working-directory: agentscope-service/service-controlplane
        run: |
          go test -p 1 ./...
          go vet ./...
          make build
          ./bin/as version | grep '^as version '
      - name: Verify Python SDK
        working-directory: agentscope-service/service-controlplane/sdk/python
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Verify DSH SDK
        working-directory: agentscope-service/service-controlplane/sdk/dsh
        run: |
          npm ci
          npm test
          npm run build
      - name: Verify Console integration
        working-directory: agentscope-service/frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
      - name: Verify Control Plane chart
        working-directory: agentscope-service/service-controlplane
        run: |
          make helm-lint
          make helm-template > /dev/null
