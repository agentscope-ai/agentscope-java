# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven
on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded runs on the same PR; pushes to main run to completion
# (separate group, and the expression is only true for pull_request events).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license:
    name: "Check License"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Check License"
        uses: apache/skywalking-eyes@ab3d1fe50d23f9c82eff489297167e2dde8ba6cb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Check Dependencies' License"
        uses: apache/skywalking-eyes/dependency@ab3d1fe50d23f9c82eff489297167e2dde8ba6cb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .licenserc.yaml
          mode: check

  module-sync:
    name: "Check Module Sync"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check extension modules are synced to agentscope-all and agentscope-bom
        run: |
          chmod +x .github/scripts/check-shade-and-bom-sync.sh
          ./.github/scripts/check-shade-and-bom-sync.sh

  redis-integration:
    name: "AG-UI Redis Integration"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.11
        ports:
          - 16389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Check Redis connection from runner
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 16389), timeout=5) as connection:
              connection.sendall(b"*1\r\n$4\r\nPING\r\n")
              with connection.makefile("rb") as response:
                  if response.readline(64) != b"+PONG\r\n":
                      raise SystemExit("Redis did not return PONG")
          PY
      - name: Run real Redis lifecycle tests
        run: >-
          mvn -B -T1
          -pl agentscope-extensions/agentscope-extensions-redis -am
          -Dtest=RedisAguiResumeLifecycleTest
          -Dagui.redis.integration=true -Dagui.redis.port=16389
          clean verify
      - name: Verify Redis tests executed without skips
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          name = "io.agentscope.extensions.redis.agui.RedisAguiResumeLifecycleTest"
          report = Path("agentscope-extensions/agentscope-extensions-redis/target/surefire-reports") / f"TEST-{name}.xml"
          if not report.is_file():
              raise SystemExit(f"Missing Redis test report: {report}")
          suite = ET.parse(report).getroot()
          counts = {key: int(suite.attrib[key]) for key in ("tests", "failures", "errors", "skipped")}
          cases = suite.findall("testcase")
          if (suite.get("name") != name or counts["tests"] <= 0
                  or any(counts[key] != 0 for key in ("failures", "errors", "skipped"))
                  or len(cases) != counts["tests"]
                  or any(case.get("classname") != name for case in cases)
                  or any(case.find(tag) is not None for case in cases for tag in ("failure", "error", "skipped"))):
              raise SystemExit(f"Redis lifecycle tests did not all execute successfully: {counts}")
          print(f"{name}: {counts}, executed={len(cases)}")
          PY
      - name: Upload Redis integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agui-redis-integration-reports
          path: agentscope-extensions/agentscope-extensions-redis/target/surefire-reports/
          if-no-files-found: warn

  build:
    runs-on: ${{ matrix.os }}
    # Fail loudly instead of burning GitHub's 6h default when a build wedges.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        include:
          - os: ubuntu-latest
            repo-cache-path: '~/.m2/repository'
          - os: windows-latest
            repo-cache-path: '~\.m2\repository'

    env:
      JAVA_VERSION: '17'

    steps:
      - name: Enable Git long paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          # No cache: 'maven' here — the explicit actions/cache step below caches the
          # same ~/.m2/repository path; a second copy only adds ~35s restore and ~0.86GB storage.

      - name: Cache Maven repository [${{ runner.os }}]
        uses: actions/cache@v4
        with:
          path: ${{ matrix.repo-cache-path }}
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build and Test with Coverage [Linux]
        if: runner.os == 'Linux'
        shell: bash
        env:
          # PRs optimize for speed: skip release-only jars. Pushes to main still run
          # javadoc (doclint) so breakage surfaces before a release. Local builds and
          # releases are unaffected — this lives in CI config only, not the pom.
          PR_SKIP_FLAGS: ${{ github.event_name == 'pull_request' && '-Dmaven.javadoc.skip=true -Dmaven.source.skip=true' || '' }}
        run: |
          # -T1C: one thread per core; Maven schedules parallel builds by the dependency
          # graph, so reactor ordering is guaranteed in parallel mode (the old -T1
          # rationale was an mvnd-specific spotless lock issue, not an ordering problem).
          mvn -B -T1C $PR_SKIP_FLAGS clean verify

      - name: Build and Test with Coverage [Windows]
        if: runner.os == 'Windows'
        run: |
          # -T1C: one thread per core (see Linux step). Standard Maven, no mvnd —
          # mvnd's parallel builds hit spotless lock contention and its embedded
          # distribution broke Surefire IPC.
          # Skip release-only artifacts (javadoc/source jars) and JaCoCo: coverage is only
          # uploaded from Linux, so instrumentation on Windows is pure overhead.
          mvn -B -T1C "-Dmaven.javadoc.skip=true" "-Dmaven.source.skip=true" "-Djacoco.skip=true" clean verify

      - name: Upload coverage reports to Codecov
        # Secrets are unavailable to fork PRs, and Codecov rejects tokenless uploads to a
        # protected branch (HTTP 400) — skipping the step beats failing the build on a run
        # that legitimately cannot upload. fail_ci_if_error stays off so codecov-side
        # outages never mask the actual build result.
        if: runner.os == 'Linux' && env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

