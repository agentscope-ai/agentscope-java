# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  license:
    name: "Check License"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Check License"
        uses: apache/skywalking-eyes@ab3d1fe50d23f9c82eff489297167e2dde8ba6cb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Check Dependencies' License"
        uses: apache/skywalking-eyes/dependency@ab3d1fe50d23f9c82eff489297167e2dde8ba6cb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .licenserc.yaml
          mode: check

  module-sync:
    name: "Check Module Sync"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check extension modules are synced to agentscope-all and agentscope-bom
        run: |
          chmod +x .github/scripts/check-shade-and-bom-sync.sh
          ./.github/scripts/check-shade-and-bom-sync.sh

  redis-integration:
    name: "AG-UI Redis Integration"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4.11
        ports:
          - 16389:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Check Redis connection from runner
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 16389), timeout=5) as connection:
              connection.sendall(b"*1\r\n$4\r\nPING\r\n")
              with connection.makefile("rb") as response:
                  if response.readline(64) != b"+PONG\r\n":
                      raise SystemExit("Redis did not return PONG")
          PY
      - name: Run real Redis lifecycle tests
        run: >-
          mvn -B -T1
          -pl agentscope-extensions/agentscope-extensions-redis -am
          -Dtest=RedisAguiResumeLifecycleTest
          -Dagui.redis.integration=true -Dagui.redis.port=16389
          clean verify
      - name: Verify Redis tests executed without skips
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          name = "io.agentscope.extensions.redis.agui.RedisAguiResumeLifecycleTest"
          report = Path("agentscope-extensions/agentscope-extensions-redis/target/surefire-reports") / f"TEST-{name}.xml"
          if not report.is_file():
              raise SystemExit(f"Missing Redis test report: {report}")
          suite = ET.parse(report).getroot()
          counts = {key: int(suite.attrib[key]) for key in ("tests", "failures", "errors", "skipped")}
          cases = suite.findall("testcase")
          if (suite.get("name") != name or counts["tests"] <= 0
                  or any(counts[key] != 0 for key in ("failures", "errors", "skipped"))
                  or len(cases) != counts["tests"]
                  or any(case.get("classname") != name for case in cases)
                  or any(case.find(tag) is not None for case in cases for tag in ("failure", "error", "skipped"))):
              raise SystemExit(f"Redis lifecycle tests did not all execute successfully: {counts}")
          print(f"{name}: {counts}, executed={len(cases)}")
          PY
      - name: Upload Redis integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agui-redis-integration-reports
          path: agentscope-extensions/agentscope-extensions-redis/target/surefire-reports/
          if-no-files-found: warn

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        include:
          - os: ubuntu-latest
            repo-cache-path: '~/.m2/repository'
          - os: windows-latest
            repo-cache-path: '~\.m2\repository'
            mvnd-cache-path: '~\.mvnd'

    env:
      MVND_VERSION: '1.0.3'
      JAVA_VERSION: '17'

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven repository [${{ runner.os }}]
        uses: actions/cache@v4
        with:
          path: ${{ matrix.repo-cache-path }}
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Cache mvnd [${{ runner.os }}]
        if: runner.os == 'Windows'
        id: cache-mvnd
        uses: actions/cache@v4
        with:
          path: ${{ matrix.mvnd-cache-path }}
          key: mvnd-${{ env.MVND_VERSION }}-${{ runner.os }}

      - name: Install mvnd [Windows]
        if: steps.cache-mvnd.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/apache/maven-mvnd/releases/download/${{ env.MVND_VERSION }}/maven-mvnd-${{ env.MVND_VERSION }}-windows-amd64.zip" `
            -OutFile "mvnd.zip"
          mkdir -Path "~\.mvnd" -Force
          Expand-Archive -Path "mvnd.zip" -DestinationPath "mvnd" -FORCE
          Copy-Item -Path "mvnd\maven-mvnd-${{ env.MVND_VERSION }}-windows-amd64\*" -Destination "~\.mvnd\" -Recurse
          Set-Content -Path "~\.mvnd\conf\mvnd.properties" -Value @"
          # mvnd client timeout settings
          mvnd.connectTimeout=120000
          mvnd.socketConnectTimeout=30000
          mvnd.cancelConnectTimeout=30000
          "@ -Encoding Utf8 -Force
          Remove-Item -Path "mvnd", "mvnd.zip" -Recurse -Force

      - name: Build and Test with Coverage [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # -T1: single-threaded build so reactor order is respected and agentscope-core
          # is installed before modules (e.g. subagent) that resolve it from the reactor.
          # Use the runner's standard Maven; mvnd's embedded distribution breaks Surefire IPC.
          mvn -B -T1 clean verify

      - name: Build and Test with Coverage [Windows]
        if: runner.os == 'Windows'
        run: |
          # -T1: single-threaded build so reactor order is respected (see Linux step).
          # -Dmvnd.maxLostKeepAlive=120: avoid StaleAddressException on long javadoc phases (mvnd#161).
          & "~\.mvnd\bin\mvnd.cmd" -B -T1 "-Dmvnd.maxLostKeepAlive=120" clean verify

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

