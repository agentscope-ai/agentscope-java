# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  license:
    name: "Check License"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Check License"
        uses: apache/skywalking-eyes@ab3d1fe50d23f9c82eff489297167e2dde8ba6cb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Check Dependencies' License"
        uses: apache/skywalking-eyes/dependency@ab3d1fe50d23f9c82eff489297167e2dde8ba6cb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config: .licenserc.yaml
          mode: check

  module-sync:
    name: "Check Module Sync"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check extension modules are synced to agentscope-all and agentscope-bom
        run: |
          chmod +x .github/scripts/check-shade-and-bom-sync.sh
          ./.github/scripts/check-shade-and-bom-sync.sh

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        include:
          - os: ubuntu-latest
            repo-cache-path: '~/.m2/repository'
          - os: windows-latest
            repo-cache-path: '~\.m2\repository'

    env:
      JAVA_VERSION: '17'

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven repository [${{ runner.os }}]
        uses: actions/cache@v4
        with:
          path: ${{ matrix.repo-cache-path }}
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build and Test with Coverage [Linux]
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # -T1: single-threaded build so reactor order is respected and agentscope-core
          # is installed before modules (e.g. subagent) that resolve it from the reactor.
          # Use the runner's standard Maven; mvnd's embedded distribution breaks Surefire IPC.
          mvn -B -T1 clean verify

      - name: Build and Test with Coverage [Windows]
        if: runner.os == 'Windows'
        run: |
          # -T1: single-threaded build so reactor order is respected (see Linux step).
          # Use standard Maven to avoid mvnd daemon startup/communication failures.
          mvn -B -T1 clean verify

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

