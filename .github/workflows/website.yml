name: Validate Mintlify Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/website.yml'
  push:
    branches: [main, Mintlify]
    paths:
      - 'docs/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run broken-links

# Mintlify's GitHub App deploys the branch configured in its Git Settings.
# No GitHub Pages build, publishing token, or Java build is required.
