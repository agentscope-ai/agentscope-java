server:
  # Default 8090 so paw coexists with agentscope-service gateway (:8080).
  port: ${CLAW_PORT:8090}

spring:
  application:
    name: agentscope-claw
  webflux:
    static-path-pattern: /**
  resources:
    static-locations:
      - classpath:/static/

# --------------------------------------------------------------------------
# agentscope-claw configuration
#
# All persistent state lives under ${claw.home} (default ~/.agentscope/claw),
# isolating claw from other harness apps (builder, dataagent, codingagent)
# that also live under ~/.agentscope/.
#
#   ${claw.home}/agentscope.json              — built-in agent definitions
#   ${claw.home}/agents.json                  — custom agent catalog
#   ${claw.home}/workspace/                   — main HarnessAgent workspace
#   ${claw.home}/agents/{agentId}/workspace/  — fallback per-agent workspace
#   ${claw.home}/agents/{agentId}/sessions.json — per-agent session store
# --------------------------------------------------------------------------
claw:
  home: ${CLAW_HOME:#{systemProperties['user.home']}/.agentscope/claw}

  # ---- aistio BYO (standalone HTTP self-register; no Kubernetes) ----
  # Flip enabled to true when running beside agentscope-service (scripts/dev-up.sh)
  # so Operate can discover this agent. Defaults match local-dev stack:
  #   control :8081, shared internal token, contract HTTP :18090.
  aistio:
    enabled: ${CLAW_AISTIO_ENABLED:false}
    control-http: ${AISTIO_CONTROL_HTTP:http://localhost:8081}
    internal-token: ${BUILDER_INTERNAL_TOKEN:local-dev-internal-token-at-least-32chars}
    agent-name: ${CLAW_AISTIO_AGENT_NAME:agentscope-paw}
    namespace: default
    contract-port: ${CLAW_AISTIO_CONTRACT_PORT:18090}
    enable-events: false

  # ---- DashScope model (used when no Model Spring bean is present) ----
  # Set DASHSCOPE_API_KEY env var or override api-key below.
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: ${CLAW_MODEL_NAME:qwen-max}
    stream: true

  # ---- Default built-in agent (used when auto-generating agentscope.json) ----
  agent:
    name: ${CLAW_AGENT_NAME:claw}
    sys-prompt: >
      You are a helpful local assistant. Answer accurately and concisely.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.agentscope: INFO
